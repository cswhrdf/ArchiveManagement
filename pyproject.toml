[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "archive-management"
dynamic = ["version"]
dependencies = [
    "apscheduler~=3.11.3",
    "customtkinter~=6.0.0",
    "httpx~=0.28.1",
    "keyring~=25.7.0",
    "platformdirs~=4.11.8",
    "psutil~=7.2.2",
    "pydantic~=2.13.5",
    "pynput~=1.8.2",
    "send2trash~=2.1.0",
]
requires-python = ">=3.12"
authors = [
    { name = "晓航", email = "52796446+cswhrdf@users.noreply.github.com" },
]
description = "用于分支、备份、恢复和导出游戏存档的桌面工具"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]

[dependency-groups]
dev = [
    "black>=26",
    "mypy>=2.3",
    "pre-commit>=4",
    "pyinstaller>=6",
    "pytest>=9",
    "pytest-cov>=7",
    "allure-pytest>=2.16",
    "ruff>=0.16",
    "pytest-timeout>=2.4.0",
]

[project.urls]
Homepage = "https://github.com/cswhrdf/ArchiveManagement"
Documentation = "https://github.com/cswhrdf/ArchiveManagement/wiki"
Repository = "https://github.com/cswhrdf/ArchiveManagement"
BugTracker = "https://github.com/cswhrdf/ArchiveManagement/issues"
Changelog = "https://github.com/cswhrdf/ArchiveManagement/releases"


[project.scripts]
archive-management = "archive_management.app:main"


[tool.hatch.build.targets.wheel]
packages = ["src/archive_management"]

[tool.hatch.build.targets.sdist]
include = ["src/archive_management"]

[tool.hatch.version]
path = "src/archive_management/packaging.py"

[tool.uv]
package = false

[tool.black]
line-length = 88
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]
extend-exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = [
    "A",
    "ANN",
    "B",
    "C90",
    "D",
    "DTZ",
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "N",
    "PERF",
    "PTH",
    "PT",
    "RET",
    "RUF",
    "S",
    "SIM",
    "UP",
]
ignore = [
    "ANN401",  # 允许 typing.Any 这种例外
    "D100",  # 忽略 module docstring
    "D104",  # 忽略 package docstring
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "D",
    "ANN",
    "S101",
    "PT011",
]

[tool.ruff.lint.isort]
known-first-party = ["archive_management"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
no_implicit_optional = false
allow_redefinition = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
# CustomTkinter 缺少完整类型标注, 主窗口按需放宽对 Any 基类的限制(PLAN 3.3)
module = ["archive_management.ui.main_window"]
disallow_subclassing_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# 每个用例都有最长执行时间: 卡住的用例会被计时器打断并打印各线程堆栈,
# 避免整套测试长时间不结束. 个别慢用例可用 @pytest.mark.timeout(N) 覆盖.
addopts = [
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "--timeout=60",
    "--timeout-method=thread",
]
markers = [
    "backend: tests for an application backend implementation",
    "blocker: highest-severity tests (run by local pre-commit)",
    "cli: tests for command-line entry points",
    "config: tests for configuration parsing and persistence",
    "critical: high-severity core tests (run by local pre-commit)",
    "database: tests for database access and persistence",
    "dialogs: tests for dialog behavior",
    "discovery: tests for game or save-location discovery",
    "domain: tests for domain models and validation",
    "i18n: tests for localization behavior",
    "integration: tests that use the filesystem or other infrastructure",
    "minor: low-severity tests (skipped by local pre-commit)",
    "no_severity: tests without an assigned severity",
    "normal: standard tests run in CI only",
    "package: tests for package imports and metadata",
    "paths: tests for filesystem path handling",
    "repository: tests for repository operations",
    "smoke: smoke tests for startup or package availability",
    "steam: tests for Steam data integration",
    "trivial: cosmetic tests (skipped by local pre-commit)",
    "ui: tests for user-interface behavior",
]

[tool.coverage.run]
branch = true
source = ["src/archive_management"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
show_missing = true
skip_covered = true
# 阶段 A 以骨架与核心模块为主, 随里程碑实现逐步上调.
fail_under = 70
