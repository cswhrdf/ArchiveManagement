[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "archive-management"
dynamic = ["version"]
dependencies = [
    "apscheduler~=3.11.3",
    "customtkinter~=6.0.0",
    "httpx~=0.28.1",
    "pillow~=12.3.0",
    "platformdirs~=4.11.8",
    "psutil~=7.2.2",
    "pydantic~=2.13.5",
    "pynput~=1.8.2",
    "send2trash~=2.1.0",
]
requires-python = ">=3.12"
authors = [
    { name = "晓航", email = "52796446+cswhrdf@users.noreply.github.com" },
]
description = "用于分支、备份、恢复和导出游戏存档的桌面工具"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]

[dependency-groups]
dev = [
    "mypy>=2.3",
    "pre-commit>=4",
    "pyinstaller>=6",
    "pytest>=9",
    "pytest-cov>=7",
    "allure-pytest>=2.16",
    "ruff>=0.16",
    "pytest-timeout>=2.4.0",
    "bandit[toml]>=1.9.4",
    "pip-audit>=2.10.1",
    "radon>=6.0.1",
    "xenon>=0.9.3",
    "deptry>=0.25.1",
]

[project.urls]
Homepage = "https://github.com/cswhrdf/ArchiveManagement"
Documentation = "https://github.com/cswhrdf/ArchiveManagement/wiki"
Repository = "https://github.com/cswhrdf/ArchiveManagement"
BugTracker = "https://github.com/cswhrdf/ArchiveManagement/issues"
Changelog = "https://github.com/cswhrdf/ArchiveManagement/releases"


[tool.hatch.build.targets.wheel]
packages = ["src/archive_management"]

[tool.hatch.build.targets.sdist]
include = ["src/archive_management"]

[tool.hatch.version]
path = "src/archive_management/packaging.py"

[tool.uv]
# 本项目以工具形式开发, **不作为包安装**(不发布到 PyPI): uv 只负责解析与安装依赖。
# 因此这里也不声明 `[project.scripts]`(声明了也装不上, 只会让每次 uv sync 打印
# "Skipping installation of entry points")。实际入口有两个:
# 1. `uv run python -m archive_management ...` —— 靠仓库根的 `.env`(PYTHONPATH=src,
#    `uv run` 会自动加载)把 src 加进导入路径, 所以不安装也能运行(见 docs/development.md);
# 2. PyInstaller 打包出的可执行文件(见 packaging/archive-management.spec; 它用 pathex
#    指向 src, 与上面的机制无关)。
package = false

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]
extend-exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = [
    "A",
    "ANN",
    "B",
    "C90",
    "D",
    "DTZ",
    "E4",
    "E7",
    "E9",
    "F",
    "G",
    "I",
    "LOG",
    "N",
    "PERF",
    "PTH",
    "PT",
    "RET",
    "RUF",
    "S",
    "SIM",
    "T20",
    "UP",
]
ignore = []

[tool.ruff.lint.per-file-ignores]
# 测试里允许用 print 做临时调试输出(例如在失败前打印现场).
"tests/**/*.py" = [
    "D",
    "ANN",
    "S101",
    "PT011",
    "T201",
]
# 命令行入口与独立脚本的职责就是向终端打印结果, 因此放行 T201.
# GUI 与用例层不得使用 print: 前者走日志, 后者用接口返回值/回调表达结果.
"src/archive_management/app.py" = ["T201"]
"scripts/**/*.py" = ["T201"]
# 注册表读取协议必须沿用 winreg 的原生方法名(OpenKey/EnumValue/EnumKey),
# 否则无法和真实模块对齐; 仅此模块放行命名规则.
"src/archive_management/services/platform_scan.py" = ["N802"]

[tool.ruff.lint.isort]
known-first-party = ["archive_management"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
# 格式化统一交给 `ruff format`(已替代 Black): 下面的取值就是 **Black 稳定版的默认风格**,
# 不要随意改动 —— 否则缩进/引号/尾随逗号会立刻与 Black 风格分叉。
# preview = false 也是刻意为之: preview 的排布规则偏离 Black 稳定版。
# 另注: `skip-magic-trailing-comma = false` 表示"尊重魔法尾随逗号"(与 Black 相同) ——
# 多行容器里写了尾随逗号就会保持展开, 不会因为放得下被折叠成一行。
preview = false
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
no_implicit_optional = false
allow_redefinition = false
ignore_missing_imports = true
mypy_path = "$MYPY_CONFIG_FILE_DIR/src:$MYPY_CONFIG_FILE_DIR/tests"

[[tool.mypy.overrides]]
# CustomTkinter 缺少完整类型标注, 主窗口按需放宽对 Any 基类的限制
module = ["archive_management.ui.main_window"]
disallow_subclassing_any = false

[tool.bandit]
# Bandit 只看源码里的**危险模式**(exec/eval、弱随机、subprocess、临时文件、硬编码口令等);
# 用例里满是 assert 与故意构造的脏数据, 扫它们只会制造噪音, 因此只扫 src。
exclude_dirs = ["tests", "scripts", "packaging", "build", "dist", ".venv", "dev-data"]
# 说明: 运行期行为由 tests/security(见 docs/testing.md)覆盖, 两者互补 ——
# Bandit 拦"写法危险", 安全用例拦"行为可被利用"。

[tool.deptry]
# 本项目**不作为包安装**(见 [tool.uv] package = false), 依赖是按"仓库源码"而不是
# "已安装的发行版"来解析的; 不声明下面这行, deptry 会把 archive_management 判成
# "传递依赖"(DEP003), 一报就是 197 条。tests 下的共享辅助模块(pythonpath = tests)
# 同样属于"自己家的代码"。
known_first_party = [
  "archive_management",
  "helpers",
  "reporting",
  "conftest",
  "gui_support",
]
exclude = ["build", "dist", ".venv", "dev-data", "allure-report", "allure-results"]

[tool.deptry.per_rule_ignores]
# 测试用例按设计导入开发依赖 —— pytest 与 allure-pytest 就是开发工具本身,
# 出现在 tests/ 里是正常的(DEP004 默认只在"运行时代码"里才该报警)。
DEP004 = ["pytest", "allure", "allure_pytest"]
# `allure` 这个模块由 allure-pytest 带进来, 测试里直接用它记附件属正常用法。
DEP003 = ["allure"]


[tool.pytest.ini_options]
# 默认只跑单元与集成测试: 性能与安全测试只在 CI 执行,
# 需要显式指定目录(`pytest tests/performance`)或标记(`pytest -m performance`).
testpaths = ["tests/unit", "tests/integration"]
# src 供被测包导入; tests 供跨模块共享的测试辅助模块(tests/helpers.py)导入.
pythonpath = ["src", "tests"]
# 每个用例都有最长执行时间: 卡住的用例会被计时器打断并打印各线程堆栈,
# 避免整套测试长时间不结束. 个别慢用例可用 @pytest.mark.timeout(N) 覆盖.
addopts = [
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "--timeout=60",
    "--timeout-method=thread",
]
markers = [
    "backend: tests for an application backend implementation",
    "blocker: safety and data-integrity guard tests (run by local pre-commit)",
    "cli: tests for command-line entry points",
    "config: tests for configuration parsing and persistence",
    "critical: core business logic tests (run by local pre-commit)",
    "database: tests for database access and persistence",
    "dialogs: tests for dialog behavior",
    "discovery: tests for game or save-location discovery",
    "domain: tests for domain models and validation",
    "epic: Allure product-level module label (see tests/conftest.py._EPICS)",
    "feature: Allure functional module label",
    "i18n: tests for localization behavior",
    "integration: tests that use the filesystem or other infrastructure",
    "layer: Allure test layer label (unit/integration/e2e)",
    "minor: presentation and helper-feature tests (CI only)",
    "no_severity: tests without an assigned severity",
    "normal: standard functional and interaction tests (CI only)",
    "package: tests for package imports and metadata",
    "paths: tests for filesystem path handling",
    "performance: benchmark and scale tests (CI only, excluded locally)",
    "repository: tests for repository operations",
    "security: security and hostile-input tests (CI only, excluded locally)",
    "smoke: smoke tests for startup or package availability",
    "steam: tests for Steam data integration",
    "story: Allure user-scenario label",
    "trivial: negligible-impact tests, e.g. palette values or report summaries (CI only)",
    "ui: tests for user-interface behavior",
]

[tool.coverage.run]
branch = true
source = ["src/archive_management"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
show_missing = true
skip_covered = true
# 覆盖率门槛: 低于该值则 pytest 失败(在 source 中排除入口与平台分支后逐步上调).
fail_under = 85
