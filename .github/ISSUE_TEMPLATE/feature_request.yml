name: 功能建议
description: 提一个新功能、一处体验改进，或对现有行为的调整
title: "[建议] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提建议之前，请先搜一遍 [现有 issue](https://github.com/cswhrdf/ArchiveManagement/issues)
        并看一眼 [docs/features.md](https://github.com/cswhrdf/ArchiveManagement/blob/main/docs/features.md)
        —— 有些想法已经有人提过，或者已经在路上。

        最有用的建议不是"加一个 X"，而是**先讲清你现在怎么做、卡在哪**：这个项目的取舍标准是
        "会不会让存档更不安全 / 会不会让一次备份产生更多重复劳动"。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决的问题
      description: 描述场景与现状（你现在的操作步骤、哪里别扭、多久遇到一次），不必先给方案
      placeholder: |
        我平时会……
        现在得……才能……
        麻烦的是……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你期望的行为
      description: 可以只描述"用起来应该是什么样"，界面细节留给我们一起定
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你试过的替代做法 / 为什么现在的做法不够
      description: 例如用别的工具、手工复制目录、改配置文件；这条能帮我们判断值不值得做
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 主要涉及哪一块？
      multiple: true
      options:
        - 游戏与存档位置管理
        - 备份、分支与时间线
        - 恢复与删除原始目录
        - 定时任务与自动备份
        - 全局快捷键
        - 游戏发现与平台支持
        - 主页、列表与海报展示
        - 导入与导出
        - 设置、主题与界面细节
        - 打包与发布
        - 使用手册与文档
        - 其它
    validations:
      required: true

  - type: dropdown
    id: willingness
    attributes:
      label: 你愿意自己提 PR 吗？
      description: 愿意的话可以直接看 CONTRIBUTING.md；不确定也没关系，这条不影响建议的采纳
      options:
        - 愿意，我可以自己写
        - 愿意，但需要有人指路（改哪个文件、怎么验）
        - 暂时不，只提想法
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我搜过现有 issue，确认这不是已有人提过或已在计划里的内容
          required: true
        - label: 我写清了"现在的做法为什么不够"，而不只是"我希望多一个按钮"
          required: true
