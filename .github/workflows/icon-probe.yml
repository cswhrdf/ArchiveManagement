name: Icon probe

# 手动触发的探针, 只回答一个问题: **这条流水线在真实 runner 上能不能从 app.svg 画出位图,
# 画出来的字节与我们入库的是否一致**。
#
# 为什么需要它: 本机有带 librsvg 的 ffmpeg, 说明不了 runner 上那份也能读 SVG —— 这是仓库
# 反复吃过的教训(本机绿 / CI 红)。它不改仓库、不碰发布: 产物写进工作区里的 `icon-probe-out/`
# 并作为 artifact 上传, 人眼还能顺便看一眼渲染质量。`release.yml` 里也有一条同类探针, 那条是
# "发布时顺带看一眼"且不拦发布(见 docs/development.md 的「应用图标」一节)。
on:
  workflow_dispatch:

permissions:
  contents: read

# 与 ci.yml / release.yml 同理: 关掉 `uv run` 的隐式 sync, 环境只由本作业自己那句 sync 决定。
env:
  UV_NO_SYNC: "1"

jobs:
  probe:
    name: 图标渲染探针
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        # 只装运行依赖(pillow 等)且**不装项目本身** —— 与 release.yml 的安装形状一致:
        # 脚本自己会把 src 放进 sys.path(见 scripts/build_icon.py 顶部), 所以这条探针验证的
        # 正是发布作业里那个环境。
        run: uv sync --locked --no-default-groups --no-install-project

      - name: Show the ffmpeg this runner has
        shell: pwsh
        run: |
          $ff = Get-Command ffmpeg -ErrorAction SilentlyContinue
          if (-not $ff) {
            Write-Host "::warning::这台 runner 上没有 ffmpeg —— 重画这条路走不通"
            exit 0
          }
          Write-Host "ffmpeg: $($ff.Source)"
          ffmpeg -hide_banner -version | Select-Object -First 3 | Write-Host
          if (ffmpeg -hide_banner -version | Select-String -Pattern "enable-librsvg" -Quiet) {
            Write-Host "::notice::这份 ffmpeg 带 librsvg —— 应该能直接读 SVG"
          } else {
            Write-Host "::warning::这份 ffmpeg 没有 --enable-librsvg —— 读不了 SVG"
          }

      - name: Render the icons next to the committed ones
        shell: pwsh
        run: |
          uv run python scripts/build_icon.py --force --out-dir icon-probe-out
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::这台 runner 画不出图标(退出码 $LASTEXITCODE)"
            exit 0
          }
          $differ = @()
          foreach ($name in @("app-256.png", "app-64.png", "app.ico")) {
            $mine = Join-Path "src/archive_management/resources" $name
            $theirs = Join-Path "icon-probe-out" $name
            $same = (Get-FileHash $mine -Algorithm SHA256).Hash -eq `
                    (Get-FileHash $theirs -Algorithm SHA256).Hash
            $verdict = if ($same) { "逐字节一致" } else { "**不同**" }
            Write-Host ("{0}: {1}" -f $name, $verdict)
            if (-not $same) { $differ += $name }
          }
          if ($differ.Count -gt 0) {
            Write-Host "::warning::与入库产物不同: $($differ -join ', ')"
          } else {
            Write-Host "::notice::runner 重画的位图与入库产物逐字节一致"
          }

      - name: Upload the rendered icons
        uses: actions/upload-artifact@v7
        with:
          name: icon-probe-rendered
          path: icon-probe-out/
          if-no-files-found: warn
