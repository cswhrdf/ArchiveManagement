name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  quality:
    name: 代码检查、类型检查与测试 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff check
        run: uv run ruff check .

      - name: Black check
        run: uv run black --check .

      - name: Mypy type check
        run: uv run mypy src

      - name: Install Xvfb (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # Linux 无真实显示, GUI 冒烟测试需要虚拟显示(Xvfb)才能执行;
      # 否则 main_window/dialogs/widgets 等 GUI 代码不参与覆盖, 导致
      # 覆盖率远低于 Windows, 触发 coverage fail_under 阈值.
      - name: Pytest with coverage (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a uv run pytest --cov --cov-report=term-missing --cov-report=xml:coverage.xml --cov-report=html

      - name: Pytest with coverage (Windows)
        if: runner.os == 'Windows'
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml:coverage.xml --cov-report=html

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: ignore
