name: CI

on:
  push:
    branches: [main, dev]
    # 纯文档改动不值得跑整套 CI(一轮约 21 个作业)。**只加在 push 上**: pull_request 若被
    # 路径过滤跳过, 分支保护里的必需检查会永远停在 pending, PR 反而合不了 —— 需要给 PR
    # 也省额度就改用"轻量作业 + 条件跳过重量级作业", 而不是让整个工作流不触发。你m
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/instructions/**"
      - ".github/prompts/**"
  pull_request:

# 连续 push 时取消被取代的运行: 旧的那轮没人看, 却跟新的那轮一样贵(21 个作业)。
# 按 ref 分组, 所以 PR、dev、main 各管各的; 始终保留最新一次提交的结论。
# 注意 `always()` 的语义是“即使被取消也返回 true”: 取消后就不该再启动的作业要用
# `always() && !cancelled()` 表达(见 pytest-report / allure-summary 的作业条件),
# 否则被取代的那一轮照样会把报告合并、生成、上传跑一遍。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

# Windows runner 的控制台是 cp1252: Python 默认按该编码输出, 打中文日志会直接报
# UnicodeEncodeError 把步骤打断(2026-09-17 的报告自检就踩过)。统一开 UTF-8 模式,
# 顺带让文件默认编码与仓库约定一致(代码里本来就处处显式写 utf-8)。
env:
  PYTHONUTF8: "1"
  # `uv run` 默认会先 sync 一次环境 —— 而 sync 装的是**默认组**(见 pyproject 的
  # [tool.uv] default-groups), 于是每个作业里第一句 `uv run ...` 就会把整套开发依赖
  # (bandit / pip-audit / pyinstaller ...) 又装回来, 上面那句按作业分组的
  # `uv sync --no-default-groups --group X` 就白做了(实测: 只装 test 组的临时环境里跑一次
  # `uv run pytest`, 51 个包被重新装回, 包括 ruff/mypy/pyinstaller)。所以 CI 里统一关掉
  # 隐式 sync: 环境只由每个作业自己那句 `uv sync --locked --no-default-groups --group ...` 决定。
  # 少写一组依赖时的表现是**响亮**的失败(uv run 报 "Failed to spawn: ruff", 退出码 2)。
  # 本地不受影响(默认组装全部), 所以这里只是在工作流层面覆盖。
  UV_NO_SYNC: "1"

jobs:
  quality:
    name: 质量检查、静态分析、性能基准与视觉回归 (ubuntu-latest)
    # 四批检查在一个作业里依次跑: ruff / ruff format / mypy(宿主平台)、deptry / bandit /
    # pip-audit / radon / xenon、性能基准、界面视觉回归(感知哈希 + SSIM)。它们都与平台无关
    # (不涉及路径分隔符; 视觉回归要显示环境, 但由本作业自己的 xvfb 提供, 截出来的画面在这里
    # 就是"标准画面"), 只在 Ubuntu 跑一遍就够 —— 每个作业实例都要重付一遍 checkout / uv
    # 安装 / 依赖同步的固定开销。
    # 平台专属的两次 mypy 不在这个作业里(见 pytest 作业的片 0)。
    # 视觉回归**不按平台展开**: 基线图入库、只在 Linux 采, 多平台会把"字体度量不同"变成
    # 一堆假红(见 PLAN.md 17.4)。
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          save-cache: false

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        # 只装这一作业需要的组(见 pyproject 的 [dependency-groups]): 这个作业跑四道门禁
        # —— 质量组(ruff/格式/mypy)、静态分析组(deptry/bandit/pip-audit/radon/xenon)、
        # 性能基准(要 pytest + allure-pytest, 即测试组)与视觉回归(视觉组: imagehash +
        # scikit-image, 那套 numpy/scipy/networkx 只在**这里**装一次, 不进每个分片)。
        # `--no-default-groups` 是必需的: 默认组是给本地开发用的, 在 CI 里它会静悄悄把
        # 全套依赖装回来(守卫会核对每次 uv sync 都显式列组)。
        # 这个作业是**唯一**不跳过安装项目的: 下面的 CLI 冒烟要真的用上可编辑包
        # (视觉回归也靠它 import 应用代码)。
        run: uv sync --locked --no-default-groups --group test --group quality --group analysis --group visual

      - name: Verify the CLI runs from the editable install
        # 项目装成可编辑包(见 pyproject 的 [tool.uv]), 其余作业都带 --no-install-project,
        # 所以用一次冒烟把"任意目录都能跑 python -m archive_management"钉住: cwd 故意换到
        # 工作区外面 —— 只有指向 src 的 .pth 能让它导入成功。
        run: |
          cd "$RUNNER_TEMP"
          uv run --project "$GITHUB_WORKSPACE" python -m archive_management init --root "$RUNNER_TEMP/am-cli-smoke"

      - name: Run quality gates (ruff / format / mypy)
        # 三项检查在脚本里依次执行: 未通过时脚本以非 0 退出(作业照常红), 但结论与完整输出
        # 已经写进 allure-results-quality, 汇总报告里能看到"哪一项没过 + 原始输出"。
        run: uv run python scripts/create_allure_quality.py --group core --results-dir allure-results-quality

      - name: Upload quality Allure results
        # 这份结论与平台无关, 不再需要按平台挑选: 质量作业只在 Ubuntu 跑。
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-quality
          path: allure-results-quality/
          if-no-files-found: ignore

      - name: Run static analysis (deptry / bandit / pip-audit / radon / xenon)
        # 上一步没过也要跑完静态分析: 两类结论各管各的, 报告里一并展示。
        # 依赖卫生与漏洞、安全扫描、复杂度: 逐项跑并写进 allure-results-analysis。
        if: always()
        run: uv run python scripts/create_allure_quality.py --group analysis --results-dir allure-results-analysis

      - name: Upload analysis Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-analysis
          path: allure-results-analysis/
          if-no-files-found: ignore

      - name: Run performance benchmarks
        # 基准只在单一平台采集: 跨运行比较需要稳定的运行环境, 换平台会让数值失去可比性。
        # 与上面两批检查合并到同一个作业: 它们都是"跑一次就够"的公共结论, 分作业只是多付
        # 一整套 checkout / uv / 依赖同步的固定开销。
        # 前面的门禁没过也要跑完: 三类结论各管各的, 报告里一并展示。
        # 阈值写在用例里: 超出预算即失败, 性能回归直接体现在 CI 状态上。
        if: always()
        run: uv run pytest tests/performance -m performance --alluredir=allure-results-performance

      - name: Upload performance baseline
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance-results
          path: |
            performance-results.json
            performance-results.csv
          if-no-files-found: ignore

      - name: Upload performance Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-performance
          path: allure-results-performance/
          if-no-files-found: ignore

      - name: Install Xvfb and a CJK font (quality job)
        # 视觉回归要一个真实显示: Tk 在无头环境里起不来, 而"起不来"不该被记成"画面没问题"。
        # 与 pytest 作业里那一步同一个配方(连 Chrome 源失效的绕行也一样): 界面是中文的,
        # 而 Tk 的量宽全靠字形度量 —— 没有 CJK 字体时汉字会被量成近乎零宽, 截出来的画面
        # 与基线对不上, 而且会以"文字没换行/没省略"的形态出现(2026-09-27 在分片里踩过)。
        #
        # ``python3-tk`` (发行版的 Tk 8.6) 是给**视觉回归那一步**装的, 详见它下面的说明:
        # uv 管的那份 Python 里带的 Tk 在 X11 上只会用核心位图字体, 而核心字体看不到任何
        # TTF —— 装再多字体也画不出汉字。
        shell: bash
        run: |
          while IFS= read -r -d '' source; do
            if grep -q 'dl.google.com/linux/chrome' "$source"; then
              sudo mv "$source" "${source}.disabled"
            fi
          done < <(find /etc/apt/sources.list.d -type f \( -name '*.list' -o -name '*.sources' \) -print0)
          sudo apt-get update
          sudo apt-get install -y xvfb fonts-noto-cjk python3-tk

      - name: Run the visual regression
        # 起一个真实窗口、拍两套画面(演示数据 + 空库)、与入库的基线图比(感知哈希距离 + SSIM)。
        # 这是一道**门禁**: 界面变了就要有人看一眼再合, 所以不一致时这一步直接红。
        # 基线图在 tests/visual-baselines/(入库); 还没有基线时本脚本只产出候选基线并写明
        # "基线尚未入库", 不判失败 —— 否则第一轮永远卡住(见脚本的模块说明)。
        # 结论写进 allure-results-visual, 由汇总作业收进报告(标签 env=common +
        # testCategory=quality, 于是它落进 Common 环境与"工程门禁:质量检查未通过"分类)。
        #
        # `-s "-screen 0 1600x1000x24"` 是必需的, 不是顺手加的: 画面尺寸直接进基线, 而
        # xvfb-run 的默认屏幕(1280x1024)装不下应用请求的 1360x860 窗口 —— 窗口会被夹到
        # 屏幕宽, 于是"默认屏幕是多少"就变成了画面尺寸的隐藏输入(xvfb-run 换默认值时
        # 假红)。显式写死屏幕后, 截出来就是应用自己的 1360x860。深度 24 同理: 默认深度
        # 偏低时颜色会被量化, 与基线对不上。
        #
        # 脚本**不依赖 ui-review/**: 那个目录被它自己的 .gitignore 挡在仓库外(CI 上根本
        # 不存在), 而且只是开发阶段的临时物 —— 曾经因为复用它的 capture.py, 这一步在 CI
        # 上直接以"找不到复用脚本"退出 2。现在建窗口/切状态都在脚本里, 只复用 tests/ 下
        # 已被 Linux 分片验证的抓图原语。
        #
        # **这一步用发行版的 Tk, 不是 uv 管的那份 Python**(实测 2026-10-02): uv 装的
        # CPython 里带的 ``libtcl9tk9.0.so`` 在 X11 上只走**核心位图字体** —— 符号表里只有
        # ``XLoadQueryFont`` / ``XCreateFontSet`` 那一套, 没有 fontconfig/FreeType, 于是它
        # 看不到任何 TTF: 截出来的画面里汉字一个都没画出来(整排按钮是空的), 拉丁字形也是
        # 位图字体(锯齿), 而这与装了多少字体无关。发行版 ``python3-tk`` 的 Tk 8.6 走
        # Xft/fontconfig, 才是与 ``fonts-noto-cjk`` 配套的那一个; ``UV_PROJECT_ENVIRONMENT``
        # 让它装进独立环境, 不动本作业其余步骤共用的 .venv。
        #
        # 脚本自己也会拦: 汉字量不出宽度时它标红**且不产出候选基线**(见 tests/unit/
        # test_report_verification.py 的守卫) —— 宁可这一轮没有基线, 也不拿一张看不清的
        # 图当"正确"。
        env:
          UV_PROJECT_ENVIRONMENT: .venv-visual
        run: |
          # 组要装齐**这一步真正用到的**: visual(感知哈希/SSIM) + test —— 脚本复用
          # ``tests/crash_capture.py`` 的抓图原语, 而那个模块 import allure(附件 API);
          # 少装 test 组时会在运行的一瞬间以 "No module named 'allure'" 退出 2
          # (2026-10-02 实测: 34 个包装完, 脚本第一步就挂)。
          uv sync --locked --no-default-groups --group test --group visual --python /usr/bin/python3.12 --python-preference only-system
          xvfb-run -a -s "-screen 0 1600x1000x24" uv run --no-sync python scripts/create_allure_visual.py --results-dir allure-results-visual --baselines tests/visual-baselines --candidates visual-baselines-candidates

      - name: Upload visual Allure results
        # 与质量/分析两份同理: 结论要进汇总报告。`if-no-files-found: error` —— 这一份缺了
        # 报告里就少一类结论, 而作业状态看不出来。
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-visual
          path: allure-results-visual/
          if-no-files-found: error

      - name: Upload candidate baselines
        # 这一份是**给人看的输入**而不是结论: 基线缺失或界面有意改动时, 把本轮真实画面传上来
        # 供下载后提交到 tests/visual-baselines/。所以 `ignore` 而不是 `error` —— 它没有产出
        # 时, 上面那一步已经红了, 再红一次只是噪音。
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-baselines-candidates
          path: visual-baselines-candidates/
          if-no-files-found: ignore

  pytest:
    # 套件按平台拆成几片并行跑, 各片只负责自己那部分用例, 由后续的 pytest-report
    # 作业把 Allure 结果与覆盖率数据合并成一份报告 —— 墙钟时间只取决于最慢的一片。
    # 平台专属的 mypy 检查也在这个作业里(片 0 的各平台各跑一次), 不再单独开作业:
    # 单独开只是多付一整套 checkout / uv / 依赖同步的固定开销, 而这里本来就有对应平台的作业。
    name: Pytest 分片测试 (${{ matrix.platform }} · 片 ${{ matrix.shard }}/${{ matrix.shards }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 逐个列条目(而不是 os × shard 两个轴): 各平台的**片数不一样**, 而且每个平台的片号
        # 必须从 0 连续编到“片数-1” —— 只声明一个 shard 轴就没法表达"Linux 三片、Windows 两片",
        # 而片号缺号或越界会让一部分用例静默不跑(pytest 按 --shard-index 取模选片)。
        # 片数按固定开销算(见 PLAN.md 第 11.4 节第 9 条): 某平台总时长 ≈ 片数 × 固定开销 +
        # 串行测试时间 T —— 减片省额度、加片省墙钟。
        # 改片数要同时改这里的 shards 与报告作业的 expect_shards:
        # tests/unit/test_sharding.py 会核对两边, 产物清单也照它声明"必须有哪几片"。
        #
        # macOS 已于 2026-09-30 恢复(见 PLAN.md 第 11.9 节), 并且只给它 **1 片**:
        # macOS runner 按 Linux 的 10 倍计价, 片数直接决定多付几整套 setup —— 1 片 = 3 个
        # macOS 实例(pytest / pytest-report / security), 本平台的 T≈260s 那么单片约 5~6 分钟。
        # 想缩短墙钟就再加一条 `{ os: macos-latest, platform: macOS, shard: 1, shards: 2 }`,
        # 并把两条条目的 shards 改成 2、报告作业的 expect_shards 改成 "0,1"(三处由
        # tests/unit/test_sharding.py 核对着一致)。
        include:
          - os: ubuntu-latest
            platform: Linux
            shard: 0
            shards: 3
          - os: ubuntu-latest
            platform: Linux
            shard: 1
            shards: 3
          - os: ubuntu-latest
            platform: Linux
            shard: 2
            shards: 3
          - os: windows-latest
            platform: Windows
            shard: 0
            shards: 2
          - os: windows-latest
            platform: Windows
            shard: 1
            shards: 2
          - os: macos-latest
            platform: macOS
            shard: 0
            shards: 1

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # 依赖缓存的唯一写入者是**每个平台的分片 0**: 同一个 uv.lock 在同一平台会算出同一个
          # cache key, 三片并行保存时只有一个能抢到, 其余两片会打印
          # "Failed to save: Unable to reserve cache ... another job may be creating this cache"
          # (分片上线后三个平台都出现过)。所以只让片 0 写, 与本 job 的其它分片、以及其它 job
          # 都只读复用(见各自的 save-cache: false) —— 每个平台只有一个写入者。
          enable-cache: true
          save-cache: ${{ matrix.shard == 0 }}

      - name: Set up Python
        # 先普通安装(命中 uv 的下载缓存时很快), **不**无条件 --reinstall: 那等于每次都
        # 重下解释器。Tcl 数据文件损坏的情况交给下面"自检失败才重装"那一步。
        run: uv python install 3.12

      - name: Install dependencies
        # 只装测试组(pytest / pytest-cov / allure-pytest / 超时插件 / 失败现场留证)**与
        # 质量组** —— 后者是给片 0 的平台专属检查用的(它跑 mypy --platform win32, 由
        # scripts/create_allure_quality.py 的 platform 组调用)。矩阵是共享的, 所以各片
        # 都装同样的组: 按片加条件会让这两句话各自带一份 ${{ }} 表达式, 得不偿失。
        # `--no-install-project`: 用例靠 pytest 的 pythonpath 导入源码, 不必把项目装进 .venv
        # (见 pyproject 的 [tool.uv])—— 带上它连构建后端都不用下。
        run: uv sync --locked --no-default-groups --group test --group quality --no-install-project

      - name: Verify Tkinter works (Windows/macOS)
        # GUI 用例把"Tk 起不来"当作环境问题 skip(见 tests/integration/test_gui_*.py 的
        # 环境守卫), 于是 Tcl 坏掉只会表现为一堆 skip —— 而 GUI 用例占覆盖率很大一块,
        # 默不作声地全 skip 会让覆盖率门槛变成一个难定位的失败(实测 67.88% < 85%)。
        # 这一步失败**不等于**作业失败(continue-on-error): 先给一次修复机会, 真正的判定
        # 在后面那次复检 —— 修不好照样红(所以不如"直接 --reinstall"容易漏掉问题)。
        # Linux 的显示环境由下面的 xvfb 提供, 不在这里检查。
        id: tkinter
        if: runner.os != 'Linux'
        continue-on-error: true
        run: uv run python -c "import tkinter; root = tkinter.Tk(); root.destroy(); print('Tkinter OK')"

      - name: Repair the interpreter and re-check Tkinter
        # 只有上一步真的失败了才重装(跳过与失败不同, 所以 Linux 不会走到这里)。uv 托管的
        # standalone 构建靠自身目录里的 tcl 数据文件定位 Tcl, 那份副本陈旧或不完整(缓存
        # 复用后出现过)时 tkinter 会报 "Can't find a usable init.tcl"(上游 astral-sh/uv#7036)。
        # 重建解释器比事后设 TCL_LIBRARY/TK_LIBRARY 更可靠, 也不影响其它平台; 重装后再 sync
        # 一次让虚拟环境跟着新解释器走, 然后立刻复检(这一步没有 continue-on-error)。
        if: steps.tkinter.outcome == 'failure'
        run: |
          uv python install --reinstall 3.12
          uv sync --locked --no-default-groups --group test --group quality --no-install-project
          uv run python -c "import tkinter; root = tkinter.Tk(); root.destroy(); print('Tkinter OK after repair')"

      - name: Install Xvfb and a CJK font (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # The hosted runner may have a stale Google Chrome index. It is unrelated to Xvfb
          # and can make apt-get update fail with a Hash Sum mismatch.
          while IFS= read -r -d '' source; do
            if grep -q 'dl.google.com/linux/chrome' "$source"; then
              sudo mv "$source" "${source}.disabled"
            fi
          done < <(find /etc/apt/sources.list.d -type f \( -name '*.list' -o -name '*.sources' \) -print0)
          sudo apt-get update
          # fonts-noto-cjk 不是可选项: 界面是中文的, 而 Tk 的量宽全靠当前字体的字形度量
          # —— 裸 runner 上没有任何中日韩字体时, 汉字会被量成近乎零宽, "按宽度裁剪/折行"
          # 的判定因此得出"放得下"的结论, 长路径不省略、状态列不折行(2026-09-27 实测:
          # Linux 分片里 test_discovery_rows_clip_long_paths... 与 test_state_column_never_
          # shows_half_a_chip 两条红, 而 Windows 上绿)。
          sudo apt-get install -y xvfb fonts-noto-cjk

      - name: Pytest with coverage (Linux)
        if: runner.os == 'Linux'
        env:
          # 每片写一份自己的覆盖率数据(合并放到 pytest-report 作业里)。
          COVERAGE_FILE: .coverage.shard-${{ matrix.shard }}
        run: xvfb-run -a uv run pytest --shard-count ${{ matrix.shards }} --shard-index ${{ matrix.shard }} --cov --cov-report= --cov-fail-under=0 --alluredir=allure-results

      - name: Pytest with coverage (Windows/macOS)
        if: runner.os != 'Linux'
        env:
          COVERAGE_FILE: .coverage.shard-${{ matrix.shard }}
        # 单片覆盖率天生偏低, 所以这里关掉报告与门槛(--cov-report= / --cov-fail-under=0):
        # 门槛只在合并后的总覆盖率上判, 见 pytest-report 作业。
        run: uv run pytest --shard-count ${{ matrix.shards }} --shard-index ${{ matrix.shard }} --cov --cov-report= --cov-fail-under=0 --alluredir=allure-results

      - name: Upload shard Allure results
        # `if-no-files-found: error`: 这一片**没产出结果**时必须在这里响亮地失败。
        # 原来写的是 `ignore` —— 结果是产物根本没被创建, 而下游(pytest-report)只能报一句
        # “某平台缺片”, 得再翻回去看这个作业才知道是哪儿断的(2026-09-30 的 macOS 分片就是
        # 这样: `allure-results-macos-latest-*` 一个目录都没匹配到, 而报告里只有它的安全结果)。
        # 这一片本来就是红的, 所以把“为什么没有产物”提到这里说, 不丢任何结论。
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-${{ matrix.os }}-${{ matrix.shard }}
          path: allure-results/
          if-no-files-found: error

      - name: Upload shard coverage data
        # .coverage.shard-* 是隐藏文件, 要显式允许上传。
        # `if-no-files-found: error` 的理由同上一处: 缺一片覆盖率数据会让合并后的百分比
        # 说成“覆盖率下路”, 而真相是这一片没跑起来。
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data-${{ matrix.os }}-${{ matrix.shard }}
          path: .coverage.shard-${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: error

      - name: Run the platform-specific check (Windows/macOS, shard 0)
        # 平台专属类型检查(mypy --platform win32 / darwin)只在该平台上跑: `--platform` 只是
        # "检查哪支代码", 并不校验执行环境 —— 放到 Ubuntu 上跑出来的结论, 挂到 Windows 环境里
        # 就是假的归属(见 scripts/create_allure_quality.py 的 platform 组)。
        # 放在测试与上传之后: 它是门禁, 而门禁失败不该让这次的测试结果拿不到。
        # 片 0 兼顾两件事(依赖缓存写入 + 这条检查), 其余片与 Linux 都不跑。
        if: matrix.shard == 0 && runner.os != 'Linux' && always()
        run: uv run python scripts/create_allure_quality.py --group platform --results-dir allure-results-quality-platform

      - name: Upload platform check Allure results
        # 结论归入那个平台的环境, 与同一平台的测试结果一起看。
        if: matrix.shard == 0 && runner.os != 'Linux' && always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-quality-platform-${{ matrix.os }}
          path: allure-results-quality-platform/
          if-no-files-found: ignore

  pytest-report:
    # 每个平台一份报告: 把该平台各片的 Allure 结果与覆盖率数据合并成一份。
    # **两台机器都在 Ubuntu 上**(矩阵里只列平台, 不再列 runner): 合并、覆盖率汇总、报告生成
    # 与自检全是纯文件操作, 与产出数据的平台无关 —— Windows runner 要按 2 倍计价, 而结论
    # 完全一样(原来那些 pwsh 分支也一起没了)。
    # 归到哪个平台由矩阵的 platform 决定, **不能再用 runner.os**(两台都是 Linux): 否则报告里
    # 会出现"产自 Ubuntu 的 Windows 结论"。覆盖率数据也是**按平台分开**合并与判门槛的。
    # 产物名与以前完全一致(allure-resources-/coverage-/allure-report-<runner 镜像名>), 汇总
    # 作业与历史回填都照旧读它们 —— 历史也按平台各一条, 改名会把累计曲线清零。
    name: 合并测试报告 (${{ matrix.platform }})
    needs: [pytest]
    # 分片作业失败也要出报告: 报告正是用来看"哪一片挂了"的。
    # 但**被取代的运行不必再出报告**: 这一条要用 `!cancelled()` 表达, 不能只写 `always()`
    # —— `always()` 连“整轮被取消”也返回 true, 那样旧的那一轮会在取消后照样启动本作业
    # (合并/生成/上传白跑一遍, 而且被取消的作业按已用时长计费)。
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 与 pytest 作业同一个平台列表与同一套片数(见那里的说明): 条目里的 os 只用来拼
        # 产物名(哪个平台的产物), platform 是报告里的环境名。
        # expect_shards 必须与那个平台在 pytest 矩阵里的片号一致
        # (tests/unit/test_sharding.py 会核对): 声明一个根本没人跑的片号等于白声明。
        #
        # download_path 是产物**下载落地的目录**, 按平台分开写 —— 因为
        # `download-artifact` 只在匹配到**多个**产物时才逐个建"以产物名命名的子目录",
        # 只匹配到一个时它把内容直接解到 ``path`` 里, 不建那层目录。macOS 只有 1 片, 正好
        # 撞上这条: path 写 "." 时那 12689 个结果文件摊在工作区根, 合并脚本按"分片目录"
        # 找就一个都匹配不到 —— 于是 macOS 的结论与覆盖率全程没进报告, 合并作业报
        # "以下模式没匹配到目录"、覆盖率报"缺片"(2026-10-01 run 36754229023 实测: 下载成功、
        # digest 校验通过、macOS 分片作业自己 2206 passed)。所以单片平台的 path 直接写成
        # 那个分片目录名, 多片平台仍写 "."(各片各自成目录)。
        include:
          - os: ubuntu-latest
            platform: Linux
            expect_shards: "0,1,2"
            download_path: .
          - os: windows-latest
            platform: Windows
            expect_shards: "0,1"
            download_path: .
          - os: macos-latest
            platform: macOS
            expect_shards: "0"
            download_path: allure-results-macos-latest-0

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # 依赖缓存的写入者是 pytest 作业的分片 0(见其注释), 这里只读复用。
          enable-cache: true
          save-cache: false

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        # 这个作业不跑用例: 它只用覆盖率 CLI 把各片数据合起来、判门槛、出报告(报告与
        # 自检脚本只用标准库), 所以只装覆盖率那一组; --no-install-project 与其它作业同理。
        run: uv sync --locked --no-default-groups --group coverage --no-install-project

      - name: Cache the npm download of the Allure CLI
        # 11.3 第 6 条(2026-09-30 落地): 每轮 CI 要现装 4 次 allure CLI(pytest-report × 3 +
        # allure-summary), 每次 10~20s。这里缓存 npm 自己的下载缓存目录(~/.npm), 命中后
        # 那 10~20s 就省下来了。
        # key 里带**钉住的版本号**: 升级 CLI 时自动换一把新钥匙, 不会拿旧版本的缓存去凑。
        # key 里再带 matrix.os: 不然三个报告作业会抢着保存同一个 key, 后两个会打印
        # "Failed to save: Unable to reserve cache"(分片上线时在 uv 缓存上碰到过同一个坑,
        # 所以 setup-uv 那时改成了只让片 0 写)。
        # **不写 runner.os**: 这个作业有一条守卫要求"平台只能来自矩阵"(两台机器都是 Linux,
        # 看一眼 runner.os 就会把两个平台的结论标成 Linux), 缓存 key 也不该开这个头。
        # 不写 restore-keys: 旧钥匙里的包对不上新版本, 回退命中只会把语义弄混乱。
        # `~/.npm` 是 npm 的内容寻址缓存(按 integrity 存), 缓存被改过会校验失败并重下; 且
        # 低信任触发(PR)默认只读(见 GitHub 的 cache-mode 说明), 所以不必担心缓存被投毒。
        # 版本取自 GitHub 官方文档的示例(仓库里没有这个 action 的先例)。
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-allure-3.18.0-${{ matrix.os }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Allure 3 CLI
        # 钉住 3.18.0: 3.13~3.17 在配了 historyPath 时会让质量门静默放行(issue #895,
        # 3.18.0 的 PR #962 修复)。升级前请照 allurerc.mjs 里的说明重跑一次门禁。
        run: npm install --global allure@3.18.0

      - name: Check Allure version
        run: allure --version

      - name: Download shard Allure results
        # 落地目录按平台给(见矩阵里 download_path 的说明): 单片平台的 path 必须**正好是那个
        # 分片目录名** —— download-artifact 只在匹配到多个产物时才逐个建子目录, 只匹配到
        # 一个时把内容直接解到 path 里。merge-multiple 显式写 false: 各片落在自己的目录里,
        # 合并交给脚本它逐片打印文件数, 少了一片能一眼看出来。
        # continue-on-error: 某片在跑测试前就挂了(没来得及上传产物)时不要连累整个作业 ——
        # 这时候更需要一份报告来看“到底哪一片没结果”。
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: allure-results-${{ matrix.os }}-*
          path: ${{ matrix.download_path }}
          merge-multiple: false

      - name: Download shard coverage data
        # 这里故意仍写 ".": 单片平台的产物会被摊到工作区根, 而 ``collect_coverage_data.py``
        # 两个布局都认(以产物名命名的子目录, 或直接在工作目录里的 ``.coverage.shard-<片>``)
        # —— 换成 download_path 反而两边都对不上。
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: coverage-data-${{ matrix.os }}-*
          path: .

      - name: Merge shard Allure results
        # 参数用引号包住通配符: pwsh 不会自己展开它, 由脚本统一展开(bash 展开了也无妨)。
        # --platform 是这个平台的**展示名**(不是 runner 镜像名): 它写进产物清单, 汇总作业
        # 拿它与报告里的环境对齐; 两台报告作业都跑在 Ubuntu 上, 所以只能由矩阵给出。
        # --expect-shards 与矩阵的 shard 列表一致(tests/unit/test_sharding.py 会核对):
        # 少一片时合并照常成功、报告也只是安静地少一部分用例(环境/通过率都看不出来),
        # 所以把"谁报了多少条、缺哪几片"写成产物清单, 随产物上传给汇总作业对数。
        run: uv run python scripts/merge_allure_results.py --output allure-results --platform "${{ matrix.platform }}" --expect-shards ${{ matrix.expect_shards }} --manifest allure-manifest.json "allure-results-${{ matrix.os }}-*"

      - name: Collect coverage data
        # 各片的 COVERAGE_FILE 是隐藏文件, 合并要求它们就在当前目录(coverage combine
        # 只扫工作目录); 下载来的产物各自落在以产物名命名的子目录里, 所以先摊平。
        # **刻意不用 `cp coverage-data-*/.coverage.shard-* ./`**: 少一片时 bash 只报一句
        # `cannot stat`, 从日志里看不出缺的是哪一片; 更糟的是只匹配到一个产物时下载动作
        # 会把它直接解到 `.`(没有 coverage-data-* 这层目录), 那条通配符什么都匹配不到 ——
        # 一个分片的数据就这么静默地没进合并, 而后面 `coverage xml` 会自己合并剩下那份
        # 并照 fail_under 报"覆盖率不达标"(2026-09-30 实测: Windows 被判 89.99% 未达标,
        # 真相是少了一片的数据)。脚本按**片号**收, 两个布局都认, 缺片点名并非 0 退出。
        # continue-on-error: 缺片时后面的步骤要能按 outcome 跳过(而不是照旧给一个残缺
        # 结论); 作业成败由末尾的 `Report the shard gap` 统一判定。
        id: collect-coverage
        continue-on-error: true
        shell: bash
        run: |
          uv run python scripts/collect_coverage_data.py --expect-shards "${{ matrix.expect_shards }}"

      - name: Combine coverage data
        # 只含**这一个平台**各片的数据(这一步的下载范围就是本平台的产物): 混在一起的话
        # 某个平台掉了一半数据也看不出来。
        # 该到的片没到齐就不合并: 残缺数据的百分比没有意义。
        if: steps.collect-coverage.outcome == 'success'
        run: uv run coverage combine

      - name: Enforce the coverage threshold
        # 门槛值在 pyproject 的 [tool.coverage.report] fail_under 里(与本地一致)。
        # 单独一步: 原生命令的非零退出码只有作为该步最后一条命令时才会让作业失败。
        if: steps.collect-coverage.outcome == 'success'
        run: uv run coverage report --show-missing

      - name: Write coverage reports
        # 数据不全时**什么报告都不产出**: 残缺数据的百分比会把"少了一片"说成"覆盖率掉了"。
        # `--fail-under=0`: 门槛判定只留给上面那一步 —— 否则同一个失败被报两次, 而且这里的
        # 文案会把缺片说成覆盖率不够。
        if: always() && steps.collect-coverage.outcome == 'success'
        run: |
          uv run coverage xml -o coverage.xml --fail-under=0
          uv run coverage html

      - name: Attach coverage report to Allure
        # 脚本把覆盖率摘要写成一条结果(按平台归到各环境), 并把原始 coverage.xml 作为
        # 附件一起放进 allure-results —— 报告里能直接下载原始数据, 不只是渲染好的表。
        # 描述开头就是达标结论("当前覆盖率 X% 大于预期覆盖率 Y%, 验证通过。"): 低于
        # fail_under 时这一项本身直接是 failed, 不再另写一条汇总结论项。
        # --platform 是这个平台的展示名: 这台机器是 Ubuntu, 但它合并的是那个平台的数据,
        # 宿主平台自己认(platform.system()) 会把结论标成 Linux。
        # 数据不全时不写这条结论: 报告里那一格会显示为"缺覆盖率结论"(汇总脚本按平台核对),
        # 比给一个看起来"掉了几个点"的百分比诚实。
        if: always() && steps.collect-coverage.outcome == 'success'
        run: uv run python scripts/create_allure_coverage.py --platform "${{ matrix.platform }}"

      - name: Report the shard gap
        # 缺片的结论必须落在作业状态上: 上面那步是 continue-on-error(不让它把后面的步骤
        # 一起掐掉), 所以这里补一次判定, 并把"该去哪找原因"写进错误信息。
        if: always() && steps.collect-coverage.outcome != 'success'
        run: |
          echo "::error::覆盖率数据不全(缺片): 本轮不判覆盖率门槛。请到本平台的分片作业里看哪一片没上传产物。"
          exit 1

      - name: Resolve previous successful run
        id: prev-run
        uses: actions/github-script@v9
        env:
          ARTIFACT_NAME: allure-resources-${{ matrix.os }}
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 30,
            });
            const candidates = runs.data.workflow_runs.filter(
              (r) =>
                r.name === "CI" &&
                r.id !== context.runId &&
                r.status === "completed" &&
                r.conclusion === "success",
            );
            for (const candidate of candidates) {
              const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: candidate.id,
                per_page: 100,
              });
              const history = artifacts.data.artifacts.find(
                (artifact) =>
                  artifact.name === process.env.ARTIFACT_NAME &&
                  !artifact.expired,
              );
              if (history) {
                core.setOutput("run_id", String(candidate.id));
                break;
              }
            }

      - name: Download previous Allure history
        if: steps.prev-run.outputs.run_id != ''
        uses: actions/download-artifact@v7
        with:
          name: allure-resources-${{ matrix.os }}
          run-id: ${{ steps.prev-run.outputs.run_id }}
          path: .previous-allure-resources
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore previous Allure history
        if: steps.prev-run.outputs.run_id != ''
        shell: bash
        run: |
          mkdir -p .allure
          cp .previous-allure-resources/.allure/history.jsonl .allure/history.jsonl

      - name: Generate Allure report
        # 历史设置(historyPath/appendHistory/historyLimit)与环境映射都在仓库根的
        # allurerc.mjs 里, CLI 会从工作目录自动读取 —— 不再临时写 `.allure/allurerc.json`
        # 再 `--config` 指定(那样会忽略仓库配置, 平台也就不会成为报告的"环境").
        if: always()
        shell: bash
        run: |
          mkdir -p .allure
          if [ -n "$(find allure-results -type f -print -quit 2>/dev/null)" ]; then
            allure generate allure-results --output allure-report
          else
            echo "没有可用的 allure-results, 跳过报告生成"
          fi

      - name: Verify Allure report
        # 报告是静态站点: 用例详情页要按需取 data/test-results/*.json。这个目录一旦
        # 在传输/解压环节丢掉, 报告就只剩"通过/失败", 点开用例是空的 —— 所以发布前
        # 先自检, 并通过 --zip 打成单个文件发布(整目录被静默丢掉的情况不会再出现)。
        # --expect-platforms 传的是矩阵里的平台: 要求这份报告里真的有**用例**结果,
        # 只有覆盖率/安全汇总项不算(本作业跑在 Ubuntu 上, runner.os 会说 Linux)。
        # --manifest 把报告里的用例数与分片自报的条数对齐 —— 少一片只有这里能发现。
        id: verify-report
        if: always()
        shell: bash
        run: uv run python scripts/verify_allure_report.py allure-report --results allure-results --zip --expect-platforms "${{ matrix.platform }}" --manifest allure-manifest.json

      - name: Upload Allure resources
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-resources-${{ matrix.os }}
          path: |
            .allure/history.jsonl
            allure-manifest.json
            allure-results/
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: ignore

      - name: Upload Allure report
        # 自检不通过时不发布报告: 宁可让作业红着, 也不要把"打不开详情"的报告发出去。
        if: always() && steps.verify-report.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: allure-report-${{ matrix.os }}
          path: allure-report.zip
          if-no-files-found: ignore

  security:
    name: 安全测试 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 三个平台一个不少地声明(与 pytest 的矩阵、报告要求的平台三处一致): macOS 是**降频**
        # 不是砍平台 —— 安全用例确实要验平台语义(大小写不敏感的文件系统、符号链接权限)。
        os: [ubuntu-latest, windows-latest, macos-latest]
        # macOS 那一条只在 push 到默认分支时跑(PLAN.md 11.4 第 10 条): macOS runner 按 Linux
        # 的 10 倍计价, 而"每个 PR 都验一遍 macOS 的路径/权限语义"与"每个平台上都验过"比起来
        # 边际收益很低。PR 与 dev 上的推送各少一个 macOS 实例, 默认分支上照旧三个平台全跑。
        #
        # 为什么写在 exclude 里: 作业级 `if` **拿不到** matrix(GitHub 的「上下文可用性」表里
        # jobs.<job_id>.if 只认 github/needs/vars/inputs, 而且官方明确写了它在矩阵展开**之前**
        # 求值), 而把同一条条件挂到作业里每个步骤上会留下"作业是绿的、其实一条安全用例都没跑"
        # 的空壳 —— 那种失败是静默的, 与本仓库的纪律相反。
        # 两个 JSON 里都**不写空格**(``{"os":"macos-latest"}``): 冒号后跟空格在 YAML 的普通
        # 标量里非法, 会让整份工作流解析失败。
        # 万一这行表达式不被接受, 工作流校验会**当场报错**(不是静默跳过), 退回静态的三平台列表即可。
        exclude: ${{ (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) && fromJSON('[]') || fromJSON('[{"os":"macos-latest"}]') }}
    # 安全防护是跨平台正确性属性: 路径越界、符号链接与权限差异都要在每个平台验证.
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # 只读复用依赖缓存(写入交给 pytest 第 0 片).
          enable-cache: true
          save-cache: false

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        # 安全用例也是 pytest 跑的, 同样只需要测试组; 项目本身不装(--no-install-project)。
        run: uv sync --locked --no-default-groups --group test --no-install-project

      - name: Run security tests
        run: uv run pytest tests/security -m security --alluredir=allure-results-security

      - name: Upload security findings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-results-${{ matrix.os }}
          path: security-results.json
          if-no-files-found: ignore

      - name: Upload security Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-security-${{ matrix.os }}
          path: allure-results-security/
          if-no-files-found: ignore

  allure-summary:
    # 汇总与发布**合并成一个作业**（2026-09-30）：这两件事本来就是“先生成报告、再发站点”的固定
    # 顺序，拆成两个作业只是多付一整套 checkout / uv / npm 的固定开销（作业实例 15 → 14）。
    # 合并的两处代价（写权限与环境只能提到作业级）见下面 permissions / environment 的注释。
    name: Allure 汇总报告与发布
    runs-on: ubuntu-latest
    # allure-resources-<平台> 现在由 pytest-report 上传, 所以汇总必须等它 —— 否则下载
    # 时产物还没传完, 汇总报告会静默地少掉各平台的测试结果。这份清单要与"产出 Allure
    # 结果的作业"一致(tests/unit/test_sharding.py 会核对)。
    # 平台专属检查、静态分析与性能基准现在都跑在 pytest 的片 0 与 quality 作业里, 所以清单里
    # 不再有 quality-platform / analysis / performance: 它们要出的产物都由这两个作业上传,
    # 等它们跑完即可。
    needs: [quality, pytest-report, security]
    # 同上: 依赖作业失败/跳过也要汇总(结论各管各的), 但整轮被取消就不启动。
    if: always() && !cancelled()
    # 发布站点要写权限, 与顶层的只读声明不同; 作业级 permissions 是**覆盖**而不是叠加 ——
    # 所以 `contents: read`(checkout 要它)与 `actions: read`(取本轮的产物)必须一起写上。
    # 工作流语法里**没有**步骤级 permissions, 所以这两个写权限在 PR 上那一次运行里也存在——
    # 这个作业只跑仓库自己的脚本(不跑 PR 里的代码), 风险可接受。
    permissions:
      contents: read
      actions: read
      # 发布 Pages 要它(顶层只给了只读)。
      pages: write
      # `deploy-pages` 用 OIDC 令牌换一次性的部署权限, 不必给长期凭据。
      id-token: write
    # 站点要挂在 github-pages 环境上(作业 URL 也来自它)。environment 同样只能挂作业级, 于是
    # **不要**给这个环境配“必需审批”: 那样每次 PR 都会停在这里等批准。
    #
    # url **刻意不写兜底**: 原来写的是
    #   `${{ steps.deploy.outputs.page_url || format('https://{0}.github.io/{1}/', ...) }}`
    # 想给"没发布的那几次"也留个链接, 结果是**假链接**: `environment.url` 是作业级表达式,
    # 无条件求值 —— 发布那三步因为 `github.ref != 默认分支` 被整段跳过时, 它照样把那个静态
    # 字符串显示在运行摘要里, 点进去必然 404(2026-10-01 实测: dev 上的运行摘要挂着
    # https://cswhrdf.github.io/ArchiveManagement/, 而同一次运行里发布三步一次都没执行)。
    # 没有 `deploy` 就没有 `page_url` → url 为空 → 摘要不挂链接, 这才是诚实的状态。
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    # 这里**刻意不写**原来那个 `concurrency: group: github-pages`: 汇总是每个 PR 都要跑的作业,
    # 共用一个组会让并发的几个 PR 互相排队(同组只允许一个 pending, 后来者会把前一个 pending
    # 取消掉)。而“两次发布撞车”本来就被顶层 concurrency(按 ref、cancel-in-progress)挡住了:
    # 只有默认分支的 push 会发布, 被取代的那一轮整轮被取消、根本走不到发布步骤。
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # 只读复用依赖缓存(写入交给 pytest 第 0 片).
          enable-cache: true
          save-cache: false

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        # 这个作业一行 Python 依赖都不需要: 脚本只用标准库(读 JSON/XML、写 Allure 结果),
        # Allure CLI 由 npm 提供。所以一个开发组都不装 —— 这一档里最划算的一个作业。
        # `--no-install-project` 保住这一点: 不带它的话, 装可编辑包要先下构建后端(hatchling)。
        run: uv sync --locked --no-default-groups --no-install-project

      - name: Cache the npm download of the Allure CLI
        # 与 pytest-report 那一处同一个规则(见那里的说明): 版本号定钥匙。
        # 这里没有矩阵, 而且这个作业固定跑在 ubuntu-latest 上(见上面的 runs-on), 所以
        # 平台直接写成字面量 —— 也不用 runner.os(理由同 pytest-report 那处)。
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-allure-3.18.0-linux

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Allure 3 CLI
        # 与 pytest 作业同一个钉住的版本(质量门在这里跑, 版本不对会静默放行)。
        run: npm install --global allure@3.18.0

      - name: Download Allure resources
        if: always()
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: allure-resources-*
          path: downloaded-allure-resources
          merge-multiple: false

      - name: Collect platform Allure results
        if: always()
        shell: bash
        run: |
          mkdir -p allure-results
          if [ -d downloaded-allure-resources ]; then
            find downloaded-allure-resources -type f -path '*/allure-results/*' \
              -exec cp {} allure-results/ \;
          fi

      - name: Collect shard manifests
        # 各平台报告作业写的产物清单(逐分片条数 + 缺哪几片): 各平台同名, 用产物目录名
        # 区分后放到同一个目录里, 交给下面的校验脚本一次性对齐。
        if: always()
        shell: bash
        run: |
          mkdir -p allure-manifests
          if [ -d downloaded-allure-resources ]; then
            find downloaded-allure-resources -type f -name 'allure-manifest.json' \
              -print0 | while IFS= read -r -d '' source; do
              cp "${source}" "allure-manifests/$(basename "$(dirname "${source}")").json"
            done
          fi
          ls -1 allure-manifests || true

      - name: Download performance Allure results
        if: always()
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: allure-results-performance
          path: allure-results

      - name: Download security Allure results
        if: always()
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: allure-results-security-*
          path: allure-results
          merge-multiple: true

      - name: Download quality Allure results
        # 只有 Ubuntu 上传了这一份(见 quality job): 公共检查不分平台, 所以每个门禁在报告里
        # 仍只有一条结论; 平台专属的那两条在下一份里。
        if: always()
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: allure-results-quality
          path: allure-results

      - name: Download platform check Allure results
        # 平台专属检查(当前只剩 Windows 的 mypy --platform win32)在对应平台上产出,
        # 归入那个平台的环境; macOS 屏蔽期间没有这份产物(下载步骤容忍缺失)。
        if: always()
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: allure-results-quality-platform-*
          path: allure-results
          merge-multiple: true

      - name: Download analysis Allure results
        # 静态分析与依赖检查同样只上传 Ubuntu 一份。
        if: always()
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: allure-results-analysis
          path: allure-results

      - name: Download visual Allure results
        # 视觉回归也只在质量作业里跑一遍(基线图入库、只在 Linux 采), 同样一份。
        # 它带 testCategory=quality, 于是运行总账的质量检查表里会多出这几行 —— 这正是
        # "视觉回归也要体现到报告里"的落点(逐张的图作为那些结论项的附件)。
        if: always()
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: allure-results-visual
          path: allure-results

      - name: Download performance baseline
        if: always()
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: performance-results
          path: .
          merge-multiple: true

      - name: Download security findings
        if: always()
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: security-results-*
          path: security-findings
          # 各平台的产物同名, 分开存放才能各自出现在汇总报告里(不能被后写的覆盖).
          merge-multiple: false

      - name: Resolve previous successful run
        id: prev-run
        if: always()
        uses: actions/github-script@v9
        env:
          ARTIFACT_NAME: allure-resources-final
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 30,
            });
            const candidates = runs.data.workflow_runs.filter(
              (r) =>
                r.name === "CI" &&
                r.id !== context.runId &&
                r.status === "completed" &&
                r.conclusion === "success",
            );
            for (const candidate of candidates) {
              const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: candidate.id,
                per_page: 100,
              });
              const history = artifacts.data.artifacts.find(
                (artifact) =>
                  artifact.name === process.env.ARTIFACT_NAME &&
                  !artifact.expired,
              );
              if (history) {
                core.setOutput("run_id", String(candidate.id));
                break;
              }
            }

      - name: Download previous Allure history
        if: steps.prev-run.outputs.run_id != ''
        uses: actions/download-artifact@v7
        with:
          name: allure-resources-final
          run-id: ${{ steps.prev-run.outputs.run_id }}
          path: .previous-allure-resources
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore previous final Allure history
        if: steps.prev-run.outputs.run_id != ''
        shell: bash
        run: |
          mkdir -p .allure
          cp .previous-allure-resources/.allure/history.jsonl .allure/history.jsonl

      - name: Summarize performance and security into Allure
        # `--expect-platforms` 与 allurerc.mjs 的 `environmentsTested`、以及下面
        # "Check every platform contributed tests" 的取值必须是同一个集合: 它决定运行总账里
        # 「结论清单」的"应有" —— 某个平台的产物整体没交上来时, 那些行会直接点名缺失
        # (而不是安静地少一节)。守卫把这个列表与配置/矩阵钉在一起。
        if: always()
        shell: bash
        run: |
          mkdir -p allure-results
          uv run python scripts/create_allure_summary.py --expect-platforms Windows,macOS,Linux

      - name: Validate the quality gate
        # 规则在仓库根的 allurerc.mjs 里(唯一来源, 这里不重复传参)。先跑、先留日志:
        # 首页「全局附件」里的运行总账会把它收进去(见 scripts/create_allure_summary.py)。
        # 校验不通过时先不中断作业(报告还要生成、上传), 由最后一步用退出码判定。
        id: quality-gate
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          if [ -n "$(ls -A allure-results)" ]; then
            set +e
            allure quality-gate --config allurerc.mjs allure-results 2>&1 \
              | tee allure-quality-gate.txt
            code=${PIPESTATUS[0]}
            # 把退出码也写进日志: 运行总账据此给出"通过/未通过", 不用去猜文本。
            echo "退出码: ${code}" >> allure-quality-gate.txt
            exit "${code}"
          fi
          echo "没有可用的 allure-results, 跳过质量门校验" | tee allure-quality-gate.txt

      - name: Generate final Allure report
        # 同 pytest 作业: 历史与环境设置都在仓库根的 allurerc.mjs 里。
        if: always()
        shell: bash
        run: |
          mkdir -p .allure
          if [ -n "$(ls -A allure-results)" ]; then
            allure generate allure-results --output allure-report
          else
            echo "没有可用的 allure-results, 跳过报告生成"
          fi

      - name: Verify final Allure report
        # 与 pytest 作业同一套自检: 缺 data/test-results 的报告只能看到用例是否通过。
        id: verify-report
        if: always()
        shell: bash
        run: uv run python scripts/verify_allure_report.py allure-report --results allure-results --zip

      - name: Check every platform contributed tests
        # "环境存在"很容易被覆盖率/安全汇总项或平台专属的质量检查满足 —— 那样"某个平台的
        # 用例全没合并进来"就没人发现(实测: 删掉 Linux 的 1166 条用例后环境依然齐全)。
        # --manifest 再补一道"分片都到齐了吗": 少一片时环境、通过率、格式自检全都正常,
        # 只有把分片自报的条数与最终条数对齐才能看出来。
        # --expect-platforms 要与实际跑的矩阵一致(要求了却没跑, 报告必然不完整、门禁
        # 无意义地红); 守卫会把三处拷在一起。
        # 这一条不拦发布(`continue-on-error`): 这属于**内容**问题, 而报告正是用来看
        # "哪个平台没数据"的东西, 拦下来反而拿不到证据; 判定交给末尾的门禁结论步骤。
        # 另外它也是仓库自己表达同一道不变式的地方(不只靠 Allure 配置里的 filter)。
        id: verify-platforms
        if: always()
        continue-on-error: true
        shell: bash
        run: uv run python scripts/verify_allure_report.py allure-report --results allure-results --expect-platforms Windows,macOS,Linux --manifest "allure-manifests/*.json"

      - name: Upload final Allure resources
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-resources-final
          path: |
            .allure/history.jsonl
            allure-results/
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Upload final Allure report
        if: always() && steps.verify-report.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: allure-report-final
          path: allure-report.zip
          if-no-files-found: ignore

      # -- 发布到 GitHub Pages(只有默认分支的 push 会真的走到) ------------------------------

      - name: Unpack the report for Pages
        # 触发条件只写在这一步(后面两步跟随它的 `ready` 输出)。四个条件缺一不可:
        # `always()` —— 步骤的 `if` 默认隐含 `success()`, 而这一步要“不论前面成不成, 都按结论
        #   决定发不发”; `!cancelled()` —— 整轮被取消就别再启动;
        # `github.event_name == 'push'` —— 未评审的内容不上站点, 而且来自 fork 的 PR 也拿不到
        #   `pages: write`(那会变成一条恒红的检查);
        # `default_branch` —— `dev` 的推送不该把站点来回覆盖(要连 dev 一起发布就把这里换成
        #   `github.ref_name == 'dev' || ...`, 但两边会互相覆盖, 得自己想清楚);
        # `steps.verify-report.outcome == 'success'` —— 就是上面 `Upload final Allure report`
        #   的挂载条件: 没通过自检的报告不发布(宁可这一轮没有站点, 也不把“打不开详情”的报告发出去)。
        # 直接解工作区里的 `allure-report.zip`: 合并成一个作业之后它就是本作业上一步的产物,
        # 不必再让 artifact 绕一圈(原来那个“下载 allure-report-final”的唯一用途就是跨作业取文件)。
        id: unpack
        if: always() && !cancelled() && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.verify-report.outcome == 'success'
        # 发布是“给人看的副本”, 不让它决定这一轮的成败: 历史趋势的基线只认
        # `conclusion == success` 的运行, 发布挂掉不该把本轮刚写好的历史行作废。
        # 原来这条 `continue-on-error` 挂在 deploy-pages **整个作业**上, 合并后只能落在发布这三步
        # 上 —— **不能**挂到作业上, 那会把质量门的结论一起吞掉。
        continue-on-error: true
        shell: bash
        run: |
          rm -rf site
          mkdir -p site
          archive="allure-report.zip"
          if [ ! -f "$archive" ]; then
            echo "::warning::没有找到 $archive, 跳过发布(报告可能没通过自检)"
            exit 0
          fi
          # Pages 要的是一个**目录**(站点根就是它): 直接传 zip 的话, 打开网址只会下载一个压缩包。
          # zip 里的条目带一层报告目录名(见 scripts/verify_allure_report.py 的打包逻辑),
          # 所以解开之后就是 site/allure-report/。
          unzip -q "$archive" -d site
          test -f site/allure-report/index.html
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Upload the report as a Pages artifact
        if: always() && steps.unpack.outputs.ready == 'true'
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/allure-report

      - name: Deploy to GitHub Pages
        # 这两个官方 action 用的是各自的**当前主版本**(仓库里没有它们的版本先例 —— 其它 action
        # 的 `@v7` 是各自的主版本)。首次 push 后若报“找不到该版本/未知 action”, 就按提示改。
        # 另: 仓库设置里的 Pages → Source 必须选 “GitHub Actions”, 否则这里必然失败。
        if: always() && steps.unpack.outputs.ready == 'true'
        continue-on-error: true
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Report quality gate verdict
        # 质量门是"结论"而不是"步骤": 报告已生成、两份 artifact 都上传完了, 现在再用它的
        # 退出码决定作业成败 —— 否则门禁不通过时连报告都拿不到(结论与输出都在首页
        # 「全局附件」的运行总账里)。放在最末尾也免得后面的 `if: success()` 步骤被跳过。
        # "有平台没有用例结果"也在这里一起判: 它同样属于"报告已经出来了才敢下结论"的事。
        if: always() && (steps.quality-gate.outcome == 'failure' || steps.verify-platforms.outcome == 'failure')
        shell: bash
        run: |
          echo "::error::质量门未通过 或 有平台没有合并进用例结果 —— 见上面的逐平台条数与报告首页「全局附件」的运行总账"
          exit 1
