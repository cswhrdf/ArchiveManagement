name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  quality:
    name: 代码质量检查 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff check
        run: uv run ruff check .

      - name: Black check
        run: uv run black --check .

      - name: Mypy type check
        run: uv run mypy src

  pytest:
    name: Pytest 测试与报告 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Allure 3 CLI
        run: npm install --global allure@3

      - name: Check Allure version
        run: allure --version

      - name: Install Xvfb (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # The hosted runner may have a stale Google Chrome index. It is unrelated to Xvfb
          # and can make apt-get update fail with a Hash Sum mismatch.
          while IFS= read -r -d '' source; do
            if grep -q 'dl.google.com/linux/chrome' "$source"; then
              sudo mv "$source" "${source}.disabled"
            fi
          done < <(find /etc/apt/sources.list.d -type f \( -name '*.list' -o -name '*.sources' \) -print0)
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Pytest with coverage (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a uv run pytest --cov --cov-report=term-missing --cov-report=xml:coverage.xml --cov-report=html --alluredir=allure-results

      - name: Pytest with coverage (Windows)
        if: runner.os == 'Windows'
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml:coverage.xml --cov-report=html --alluredir=allure-results

      - name: Attach coverage report to Allure
        run: uv run python scripts/create_allure_coverage.py

      - name: Resolve previous successful run
        id: prev-run
        uses: actions/github-script@v9
        env:
          ARTIFACT_NAME: allure-history-${{ matrix.os }}
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 30,
            });
            const candidates = runs.data.workflow_runs.filter(
              (r) =>
                r.name === "CI" &&
                r.id !== context.runId &&
                r.status === "completed" &&
                r.conclusion === "success",
            );
            for (const candidate of candidates) {
              const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: candidate.id,
                per_page: 100,
              });
              const history = artifacts.data.artifacts.find(
                (artifact) =>
                  artifact.name === process.env.ARTIFACT_NAME &&
                  !artifact.expired,
              );
              if (history) {
                core.setOutput("run_id", String(candidate.id));
                break;
              }
            }

      - name: Download previous Allure history
        if: steps.prev-run.outputs.run_id != ''
        uses: actions/download-artifact@v7
        with:
          name: allure-history-${{ matrix.os }}
          run-id: ${{ steps.prev-run.outputs.run_id }}
          path: .allure
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Allure report (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p .allure
          cat > .allure/allurerc.json <<'JSON'
          {"historyPath": "./.allure/history.jsonl", "appendHistory": true, "historyLimit": 40}
          JSON
          allure generate allure-results --output allure-report --config ./.allure/allurerc.json

      - name: Generate Allure report (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .allure | Out-Null
          Set-Content -Path .allure/allurerc.json -Encoding ascii -Value '{"historyPath": "./.allure/history.jsonl", "appendHistory": true, "historyLimit": 40}'
          allure generate allure-results --output allure-report --config ./.allure/allurerc.json

      - name: Upload Allure history for next run
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-history-${{ matrix.os }}
          path: .allure/history.jsonl
          if-no-files-found: ignore

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: ignore

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report-${{ matrix.os }}
          path: |
            allure-results/
            allure-report/
          if-no-files-found: ignore
