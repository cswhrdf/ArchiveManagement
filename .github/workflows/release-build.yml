name: Build Packages

# **只读的构建工作流**: 这里只做"编出产物 + 上传 artifact", 一个写权限都没有。Windows 与
# Linux 两个作业并行(`build` / `build-linux`), 一次调用两份产物都出来。三个调用方(口径见
# docs/development.md 的「打包」「发布」两节):
#   ① `ci.yml` 的 `package` 作业 —— "合入 main 的 PR 且 CI 全绿"时的打包门禁;
#   ② `release.yml` 的 `build` 作业 —— 合入 main 之后发布, 或手动编任意分支/提交;
#   ③ `dev-release.yml` 的 `build` 作业 —— dev 的手动预发布快照。
# **为什么构建与发布必须是两份工作流**(2026-10-17 实测, 不是设计洁癖): GitHub 对嵌套工作流的权限
# 是**逐作业静态校验**的 —— 被调用的那份里只要有一个作业声明 `contents: write`, 而调用方(PR 那次
# 运行, 顶层 `contents: read`)给不出写权限, 整份工作流就判 "not valid", 报错原文是
# `The nested job 'publish' is requesting 'contents: write', but is only allowed 'contents: read'`;
# 它发生在**解析阶段**, 连一个 job 都不会启动(与运行期的 `if: publish == false` 无关)。所以发布那一档
# 留在 release.yml(只有它需要写权限), 门禁调这一份只读的。
# **为什么一份 Linux 产物就够、不按发行版出包**(2026-11-01 定): 兼容边界只有两件事 —— glibc
# 地板(由构建机决定, 见 build-linux 的 runs-on 注释)与运行期的 X11 客户端库/fontconfig(凡有桌面
# 就有)。`.deb`/`.rpm`/AppImage 只是分发格式增量; Alpine(musl) 要另一整套构建, 不在本期范围。
on:
  workflow_call:
    inputs:
      ref:
        description: "要构建的分支或提交, 留空 = 触发这次运行的那个提交"
        required: false
        default: ""
        type: string
      checks:
        description: "构建前的检查档位: full(ruff/格式/mypy/全量用例 + 平台口径的覆盖率门禁) | build-only(只构建, 给 CI 已经跑过全量的门禁档用)"
        required: false
        default: full
        type: string
      version_override:
        description: "覆盖版本号(留空 = 从 packaging.py 读)。预发布快照传四段号, 见 dev-release.yml"
        required: false
        default: ""
        type: string
    outputs:
      version:
        description: "从 packaging.py 读出的版本号(发布作业用它判要不要建 Release)"
        value: ${{ jobs.build.outputs.version }}
      label:
        description: "产物名里的构建标签(<ref>-build-<本次构建号>)"
        value: ${{ jobs.build.outputs.label }}
      linux_label:
        description: "Linux 作业自己算出的构建标签(公式与 Windows 那份一致, 两作业并行所以各算各的)"
        value: ${{ jobs.build-linux.outputs.label }}

permissions:
  contents: read

# 与 ci.yml 同理: 关掉 `uv run` 的隐式 sync, 否则它会按 pyproject 的**默认组**把整套开发
# 依赖装回来(这个作业已经显式装了 test / quality / package 三组)。
env:
  UV_NO_SYNC: "1"
  # **Windows runner 的控制台是 cp1252**(英文系统), 而用例与收集期会打印中文: `conftest` 的
  # `_cluster_shared_ui_sessions` 一句 `[order] 共享 UI 会话的同池模块已聚成一段执行` 就够让
  # `print` 抛 UnicodeEncodeError、pytest 以 INTERNALERROR 收场("no tests ran")。
  # 2026-10-31 实测: release.yml 首次跑 full 档(此前打包门禁都是 build-only)就断在这一步。
  # ci.yml 一直有这一行, 所以同一个用例在 CI 上从来不红 —— 两份工作流的环境地板必须一致。
  PYTHONUTF8: "1"

jobs:
  build:
    # 不写作业级 `if:`: 两个调用方都是"该构建时才调" —— ci.yml 只在合入 main 的 PR 上调, release.yml
    # 的 push 档在 `paths-ignore` 就把纯文档合入挡掉了。原来那条 `pull_request: closed` + 来源分支名
    # (dev / bugfix/*)的判据有个盲区: 从别的分支(如 hotfix/x)合入 main 就不构建 —— 已换成 push。
    name: 构建 Windows 发布包
    runs-on: windows-latest
    outputs:
      version: ${{ steps.build.outputs.version }}
      label: ${{ steps.build.outputs.label }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # 被调用时 `github.sha` 是**调用方**的提交(PR 轮次里就是那个 PR 的合并预览提交) —— 正是要构建的
          # 东西; 手动/发布档没给 `ref` 时也同样落在触发这次运行的那个提交上。
          ref: ${{ inputs.ref || github.sha }}

      - name: Stamp the snapshot version into the source
        # 预发布的第 4 位是**派生**量(scripts/dev_snapshot_version.py 按 git 历史算), 它不进 git ——
        # dev 上的 packaging.py 必须保持三段, 那是正式版本的单一真相(release_bump.py 按三段判档)。
        # 所以只在这次构建的工作区里就地改这一行: 于是产物的 `--version` 与 `doctor` 报的是
        # 同一个快照号, 而不是一个连预发布都看不出来的基础版本。
        # **只配 build-only**: full 档会跑用例, 而用例里有一批"packaging.py 是三段"的断言 ——
        # 那个红是故意的, 这里提前一步说清楚。
        if: ${{ inputs.version_override != '' }}
        shell: pwsh
        env:
          SNAPSHOT_VERSION: ${{ inputs.version_override }}
          CHECKS: ${{ inputs.checks }}
        run: |
          if ($env:CHECKS -ne 'build-only') {
            throw "version_override 只能配 checks: build-only(预发布档的前提是 CI 已经把这个提交跑绿了)"
          }
          $path = "src/archive_management/packaging.py"
          $source = Get-Content $path -Raw
          $replacement = '__version__ = "' + $env:SNAPSHOT_VERSION + '"'
          $updated = [regex]::Replace($source, '__version__\s*=\s*"[^"]+"', $replacement)
          if ($updated -eq $source) {
            throw "$path 里没有可替换的 __version__"
          }
          Set-Content -Path $path -Value $updated -NoNewline
          Write-Host "快照版本号已写入: $env:SNAPSHOT_VERSION"

      - name: Resolve build metadata
        id: build
        shell: pwsh
        env:
          INPUT_REF: ${{ inputs.ref }}
          # PR 轮次里 `github.ref_name` 是 `<PR 号>/merge`, 所以来源分支要单独排在它前面。
          HEAD_REF: ${{ github.head_ref }}
          DEFAULT_REF: ${{ github.ref_name }}
        run: |
          # 产物名里的 ref 依次取: 显式传入的 ref → PR 的来源分支 → 触发这次运行的分支。
          $ref = if ($env:INPUT_REF) {
            $env:INPUT_REF
          } elseif ($env:HEAD_REF) {
            $env:HEAD_REF
          } else {
            $env:DEFAULT_REF
          }
          $source = Get-Content src/archive_management/packaging.py -Raw
          $match = [regex]::Match($source, '__version__\s*=\s*"([^"]+)"')
          if (-not $match.Success) {
            throw "Could not find __version__ in packaging.py"
          }
          $version = $match.Groups[1].Value
          $safe_ref = $ref -replace '[^A-Za-z0-9._-]', '-'
          "ref=$ref" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "label=$safe_ref-build-${{ github.run_number }}" >> $env:GITHUB_OUTPUT

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        # 只装这个作业要用的组(见 pyproject 的 [dependency-groups]): 构建前的门禁要
        # 质量组(ruff/mypy)、测试组(pytest)**与覆盖率组(coverage CLI)** —— 后两组分开列是
        # 必需的: 覆盖率判定走 `coverage run/report` 而不是 `pytest --cov`(见下一步的说明),
        # 而 tests/unit/test_test_config.py 那两条守卫是按命令推组的。打包要 package 组。
        # `--no-install-project`: 打包靠 spec 里的 pathex 指向 src, 不需要把项目装进 .venv
        # (见 pyproject 的 [tool.uv]; 与 ci.yml 的其它作业一致)。
        # 门禁档(`checks: build-only`)跑的是同一套组 —— 为了省一次 sync 而拆两套环境不划算, 而
        # 且下面那批守卫是**按命令**算该装哪几组的。
        run: uv sync --locked --no-default-groups --group test --group quality --group coverage --group package --no-install-project

      - name: Run build checks
        # 门禁档传 `checks: build-only`: 同一轮 CI 已经跑过三平台的用例与静态检查, 再在 Windows
        # runner(2 倍计价)上跑一遍只是多花时间。发布/手动档默认 full, 留着这一轮自证。
        # 注意 push 档取不到 `inputs`(空串) —— 空串不等于 build-only, 所以照跑。
        if: ${{ inputs.checks != 'build-only' }}
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src

      - name: Run the test suite under this platform's coverage config
        # **不能裸跑 `pytest --cov`**: pyproject 的 [tool.coverage.report] 是**三平台并集**的
        # 基线(故意不带平台排除 —— 合并口径就是它的含义), 而有一小撮代码只可能跑在自己的
        # 平台上(winreg / msvcrt / fcntl / Win32 置顶查询)。
        # 2026-10-31 实测(release.yml 首次跑 full 档): 2998 条用例全绿, 覆盖率却报
        # **99.94% < fail_under=100**, 缺的正是 platform_scan.py:162-163、
        # single_instance.py:164/296-297/310-311、topmost.py:41-42 这些打着
        # `# platform: linux macos` 的行 —— 在 Windows 上它们本来就不该计入。
        # CI 的覆盖率作业(combine 之后 `coverage_platform.py write` + `coverage report`)与本地
        # `scripts/run_tests_local.py --coverage` 都是先写平台配置再判门槛, 三处口径必须一致;
        # 这里也顺便把采数放到同一份配置下(conftest 里设的 COVERAGE_RCFILE 对 pytest-cov
        # 不生效: 它在导入根 conftest 之前就把 Coverage 建好了)。
        if: ${{ inputs.checks != 'build-only' }}
        run: |
          uv run python scripts/coverage_platform.py write .coverage-platform.rc
          # pwsh 只认**最后一条**命令的退出码: 中间不拦的话, 用例红了会被后面的 report 收场,
          # 而"数据不全的 report"照样可能过门槛(假绿)。每步都自己判一次。
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run coverage run --rcfile=.coverage-platform.rc -m pytest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run coverage report -m --rcfile=.coverage-platform.rc

      - name: Check the application icon is up to date
        # 硬门禁: 入库的位图必须出自当前这份 resources/app.svg("改了 SVG 忘了重画"就在这里判红)。
        # 这一步**不需要 ffmpeg**(只比指纹), 所以发布不依赖 runner 上有渲染工具 —— 也从不在
        # CI 上重画: 图标只在本地更新(2026-10-15 拆掉了原来的信息探针与 `Icon probe` 工作流,
        # 见 docs/development.md)。
        run: uv run python scripts/build_icon.py --check

      - name: Build the onefile package
        # 产物是单个 `dist/ArchiveManagement.exe`(2026-10-31 起回到 onefile, 见 spec 末尾的
        # 说明): 发布页只挂这一个文件, 用户下载双击就能用。
        run: uv run pyinstaller --noconfirm --clean packaging/archive-management.spec

      # 产物冒烟: 「能编」与「产物能起」是两件事 —— 跑不起来的包不该被上传成"看起来能发"的样子。
      # 判据 = 退出码 + 侧效应(临时 root 下真的出现 config/data/logs、日志里出现"界面启动"),
      # 不读 stdout —— 窗口化产物(console=False)没有控制台。五条判据 × 那一份单文件产物(无参数
      # 启动 / --version / doctor / gui --smoke / 单实例闸门), 全部限时, 超时在脚本里按
      # CI runner 的最坏情况给足。门禁档与发布档共用这一步; 位置由守卫
      # test_the_build_smokes_the_packages_it_produced 钉住(构建之后、打 release/ 之前)。
      # `--report` 把逐条判据落成 smoke-report.json(失败也写), 交给下面两步转成 Allure 结论
      # 并上传 —— 退出码管门禁, 报告管"哪一条没过"。
      - name: Smoke test the built packages
        run: uv run python scripts/smoke_packaged.py --report smoke-report.json

      # 冒烟结论并入汇总报告: 上面那步落的 JSON 在这里转成 Allure 结果项(每条判据一条,
      # 带 env=Windows 归进那个平台的环境)。挂 `if: always()` 是刻意的:
      # 冒烟红的时候结论更要进报告 —— 只给一个退出码, 下一次还得去翻日志猜是哪一条红的。
      # 这一步不判门禁(退出码恒 0), 详见 scripts/create_allure_smoke.py 的说明。
      - name: Write smoke results into Allure
        if: always()
        run: uv run python scripts/create_allure_smoke.py --report smoke-report.json --results-dir allure-results-smoke-windows

      # 产物名固定 allure-results-smoke-windows: 匹配汇总作业的 `pattern: allure-results-*`
      # (一份 pattern 自动收走), 但不匹配每平台报告作业的 `allure-results-<os>-*` —— 不会
      # 被错并进单平台报告(守卫 test_the_packaging_smoke_results_reach_the_final_report)。
      # `if-no-files-found: ignore`: 冒烟步没跑(构建更早红掉)时本来就没有结论可传, "该有而
      # 没有"由汇总作业的运行总账按条件期望点名, 不在这里叠一个误导性的红。
      - name: Upload smoke Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-smoke-windows
          path: allure-results-smoke-windows/
          if-no-files-found: ignore

      - name: Prepare the release file
        # 发布页只挂**一个文件**, 名字就是产物名(2026-10-31 定): 早先这里是 zip + SHA256SUMS.txt
        # + build-metadata.json, 它们服务的是“要校验和、要构建元数据”的人 —— 而在下载页上只是
        # 让用户多点两下、还得先解压一次才能用。单文件 exe 直接拷过去即可。
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist/ArchiveManagement.exe release/ArchiveManagement.exe

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ArchiveManagement-${{ steps.build.outputs.label }}-windows-x64
          path: release/

  build-linux:
    # 与上面的 build 并行编 Linux 包: 同一份 spec、同一套判据, 差异全在工作流这一层 ——
    # 系统依赖(Xvfb/字体/发行版 Tk)、冒烟要包一层 xvfb-run、产物打成 tar.gz。
    # **不跑构建前检查**(ruff/mypy/用例/图标核对都不在): 门禁档(`checks: build-only`)本来就
    # 不跑; 发布档的 full 检查由上面的 Windows 作业代跑 —— 同一个提交, 静态检查与全量用例
    # 在哪个 runner 上跑结论都一样, 而 ci.yml 的三平台矩阵里 Ubuntu 每轮都跑过全套, 在这里
    # 再跑一遍只是双倍计费。图标指纹核对留在 Windows 作业: 位图入库两平台共用, 那边红得早。
    name: 构建 Linux 发布包
    # **钉 ubuntu-24.04, 不是 ubuntu-latest**: 发行版 `_tkinter` 的 ABI 必须与冻结的解释器
    # (uv 装的 CPython 3.12)同小版本 —— 24.04 的系统 Python 是 3.12; 更老的 22.04 是 3.10
    # (装不上), ubuntu-latest 将来漂到 26.04 又会变版本, 配方会静默失效。顺带定下 glibc
    # 地板 2.39(Ubuntu 24.04+ / Debian 13+ / Fedora 40+ / Arch / openSUSE 15.6+); 想降到
    # Debian 12 / Ubuntu 22.04 得换一条给老发行版供 3.12+Xft-Tk 的路(如 deadsnakes), 留作
    # 后续工作 —— 见 spec 末尾的兼容性口径。
    runs-on: ubuntu-24.04
    outputs:
      label: ${{ steps.build.outputs.label }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # 与 Windows 作业同一个 ref 口径: 被调用时 github.sha 是调用方的提交。
          ref: ${{ inputs.ref || github.sha }}

      - name: Stamp the snapshot version into the source
        # 与 Windows 作业同一个理由: 预发布的第 4 位是派生量, 只写进本次构建的工作区,
        # 两个平台的产物报同一个快照号。
        if: ${{ inputs.version_override != '' }}
        shell: bash
        env:
          SNAPSHOT_VERSION: ${{ inputs.version_override }}
          CHECKS: ${{ inputs.checks }}
        run: |
          if [ "$CHECKS" != 'build-only' ]; then
            echo "::error::version_override 只能配 checks: build-only(预发布档的前提是 CI 已经把这个提交跑绿了)"
            exit 1
          fi
          sed -i -E 's/__version__[[:space:]]*=[[:space:]]*"[^"]+"/__version__ = "'"$SNAPSHOT_VERSION"'"/' src/archive_management/packaging.py
          grep -q '__version__ = "'"$SNAPSHOT_VERSION"'"' src/archive_management/packaging.py || {
            echo "::error::src/archive_management/packaging.py 里没有可替换的 __version__"
            exit 1
          }
          echo "快照版本号已写入: $SNAPSHOT_VERSION"

      - name: Resolve build metadata
        # 与 Windows 作业**同一份公式**: 两个作业并行, 不能去 needs 那边的 output(串行就要
        # 白等 Windows 的整段构建)。ref 与 run_number 对同一轮调用是同一个值, 两边算出的
        # label 必然一致; 守卫(tests/unit/test_ci_workflow.py)把两份公式钉在一起。
        id: build
        shell: bash
        env:
          INPUT_REF: ${{ inputs.ref }}
          HEAD_REF: ${{ github.head_ref }}
          DEFAULT_REF: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_REF" ]; then ref="$INPUT_REF"
          elif [ -n "$HEAD_REF" ]; then ref="$HEAD_REF"
          else ref="$DEFAULT_REF"; fi
          version=$(grep -oP '__version__\s*=\s*"\K[^"]+' src/archive_management/packaging.py | head -n1)
          if [ -z "$version" ]; then
            echo "::error::Could not find __version__ in packaging.py"
            exit 1
          fi
          safe_ref=$(printf '%s' "$ref" | sed -E 's/[^A-Za-z0-9._-]/-/g')
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "label=$safe_ref-build-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Install Xvfb, a CJK font, and the distro Tk 8.6
        # 与 ci.yml 视觉回归作业同一个配方(完整实测记录在那边的注释里, 这里只留打包视角):
        # ① GUI 冒烟要一个显示(xvfb-run), fonts-noto-cjk 让汉字有字形可量;
        # ② **打包必须换发行版的 Tk**: uv 托管的 CPython(python-build-standalone)自带的
        #    Tcl/Tk 在 X11 上只走核心位图字体, 符号表里没有 fontconfig/FreeType —— 直接
        #    打包的话, 产物"能起"但界面是中文却一个汉字都画不出来(冒烟只看日志与退出码,
        #    拦不住这种"能起但没法用")。发行版 python3-tk 的 _tkinter 链发行版 libtk8.6
        #    (Xft/fontconfig), 与冻结的解释器同小版本 ABI 兼容 —— 把它放到 PYTHONPATH 最
        #    前面, PyInstaller 分析到的就是它, 连同发行版 libtk8.6/libtcl8.6 一起冻结进包;
        #    用户机器上只要有任何桌面字体, 汉字就由 fontconfig 解析。
        shell: bash
        run: |
          # 已装即跳过 apt(与 ci.yml 同一个理由: apt-get update 是每轮必付的网络敞口)。
          installed=0
          for pkg in xvfb fonts-noto-cjk python3-tk tcl8.6 tk8.6; do
            dpkg-query -W -f='${Status}' "$pkg" 2>/dev/null | grep -q 'install ok installed' && installed=$((installed + 1))
          done
          if [ "$installed" -eq 5 ]; then
            echo "xvfb / CJK 字体 / 发行版 Tk 8.6 已在机上, 跳过 apt"
          else
            # The hosted runner may have a stale Google Chrome index. It is unrelated to Xvfb
            # and can make apt-get update fail with a Hash Sum mismatch.
            while IFS= read -r -d '' source; do
              if grep -q 'dl.google.com/linux/chrome' "$source"; then
                sudo mv "$source" "${source}.disabled"
              fi
            done < <(find /etc/apt/sources.list.d -type f \( -name '*.list' -o -name '*.sources' \) -print0)
            sudo apt-get update
            sudo apt-get install -y xvfb fonts-noto-cjk python3-tk tcl8.6 tk8.6
          fi
          # 发行版 _tkinter 留一份: 构建步把它放到 PYTHONPATH 最前面(与 ci.yml 视觉回归同手法)。
          mkdir -p "$RUNNER_TEMP/tk-xft"
          cp "$(python3 -c 'import _tkinter; print(_tkinter.__file__)')" "$RUNNER_TEMP/tk-xft/"
          python3 -c "import _tkinter, tkinter; print('发行版 Tk:', _tkinter.__file__, tkinter.TkVersion)"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        # 只装 package 组: 这个作业不跑检查不跑用例(见作业开头的注释), 而冒烟与结论脚本
        # (smoke_packaged.py / create_allure_smoke.py)都只用标准库。
        run: uv sync --locked --no-default-groups --group package --no-install-project

      - name: Build the onefile package
        # PYTHONPATH 换发行版 _tkinter(来路见 apt 那步); TCL_LIBRARY/TK_LIBRARY 帮
        # PyInstaller 找到发行版摊在 /usr/share/tcltk 的 Tcl/Tk 脚本库(Debian 系布局,
        # 不在二进制旁边) —— 少了它们, 冻结产物会以 "Can't find a usable tk.tcl" 起不来。
        env:
          PYTHONPATH: ${{ runner.temp }}/tk-xft
          TCL_LIBRARY: /usr/share/tcltk/tcl8.6
          TK_LIBRARY: /usr/share/tcltk/tk8.6
        run: uv run pyinstaller --noconfirm --clean packaging/archive-management.spec

      # 以下四步与 Windows 作业同一个骨架, 差异只有: 冒烟包在 xvfb-run 里、结论目录/产物名
      # 的平台段是 linux。位置约束同样由守卫 test_the_build_smokes_the_packages_it_produced 钉住。
      - name: Smoke test the built packages
        # **不**带 PYTHONPATH/TCL_LIBRARY: 冒的是冻结后的产物, 环境必须与用户机器一致 ——
        # 包里的 Tk 就该是刚冻进去的那份。默认屏幕尺寸够用: 冒烟只看日志与退出码, 不做
        # 像素比对(不需要视觉回归那种加大屏幕)。
        run: xvfb-run -a uv run python scripts/smoke_packaged.py --report smoke-report.json

      - name: Write smoke results into Allure
        if: always()
        run: uv run python scripts/create_allure_smoke.py --report smoke-report.json --results-dir allure-results-smoke-linux

      - name: Upload smoke Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-smoke-linux
          path: allure-results-smoke-linux/
          if-no-files-found: ignore

      - name: Prepare the release file
        # tar.gz 而不是裸二进制: 浏览器下载裸文件会丢可执行位, tar 保留权限(Windows 作业没有
        # 这个问题, 所以那边是直接拷)。解出来就是单个可执行文件, 与 Windows 的"下载即用"对齐。
        run: |
          mkdir -p release
          tar -czf release/ArchiveManagement-linux-x64.tar.gz -C dist ArchiveManagement

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ArchiveManagement-${{ steps.build.outputs.label }}-linux-x64
          path: release/
