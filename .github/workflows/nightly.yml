name: Nightly

# nightly 只做一件事: 带 `ref: dev` **调用 ci.yml** 跑一轮全量 + 报告。
#
# 为什么这样拆(2026-10-09): 全量分片、覆盖率门槛、逐平台报告与汇总全都只有一份定义
# (ci.yml), 这里不复制任何作业 —— 也就没有"两份文件各写一遍分片矩阵与报告链, 改一处
# 忘了另一处"的问题。
#
# 为什么每晚都跑(2026-10-14 去掉 24h 门): 之前先判断"dev 自上一轮以来有没有新提交",
# 没动就整轮跳过; 用户要求回退成"每次都跑全部", 所以那个 gate 作业已删除 —— 定时这一轮
# 无条件跑一轮全量 + 报告。
#
# 被调用的那一轮测的是 **dev 的代码**(见 ci.yml 里每个 checkout 的 `inputs.ref`), 报告里
# 的提交号也是 dev 的; 工作流名仍是 CI, 所以报告历史链与 push / PR 那两轮共用同一条曲线。
on:
  schedule:
    - cron: "0 19 * * *" # UTC 19:00 = 北京时间次日凌晨 3 点
  # 手工补跑(例如刚合入 dev 但当晚的 nightly 已经跑过)。
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-run:
    name: 全量 + 报告
    # 被调用的工作流里没有"要不要跑"的判断, 全量 + 报告是它的全部职责。
    uses: ./.github/workflows/ci.yml
    with:
      ref: dev
