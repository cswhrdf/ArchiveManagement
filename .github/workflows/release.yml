name: Build Windows Package

on:
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:
    inputs:
      ref:
        description: "要构建的分支或提交,例如 dev"
        required: false
        default: main
        type: string

permissions:
  contents: read

# 与 ci.yml 同理: 关掉 `uv run` 的隐式 sync, 否则它会按 pyproject 的**默认组**把整套开发
# 依赖装回来(这个作业已经显式装了 test / quality / package 三组)。
env:
  UV_NO_SYNC: "1"

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && (github.event.pull_request.head.ref == 'dev' || startsWith(github.event.pull_request.head.ref, 'bugfix/'))) }}
    name: 构建 Windows 发布包
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Resolve build metadata
        id: build
        shell: pwsh
        env:
          INPUT_REF: ${{ inputs.ref }}
          PR_SOURCE_REF: ${{ github.event.pull_request.head.ref }}
          DEFAULT_REF: ${{ github.ref_name }}
        run: |
          $ref = if ($env:INPUT_REF) {
            $env:INPUT_REF
          } elseif ($env:PR_SOURCE_REF) {
            $env:PR_SOURCE_REF
          } else {
            $env:DEFAULT_REF
          }
          $source = Get-Content src/archive_management/packaging.py -Raw
          $match = [regex]::Match($source, '__version__\s*=\s*"([^"]+)"')
          if (-not $match.Success) {
            throw "Could not find __version__ in packaging.py"
          }
          $version = $match.Groups[1].Value
          $safe_ref = $ref -replace '[^A-Za-z0-9._-]', '-'
          "ref=$ref" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "label=$safe_ref-build-${{ github.run_number }}" >> $env:GITHUB_OUTPUT

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        # 只装这个作业要用的组(见 pyproject 的 [dependency-groups]): 构建前的门禁要
        # 质量组(ruff/mypy)与测试组(pytest --cov), 打包要 package 组(pyinstaller)。
        # `--no-install-project`: 打包靠 spec 里的 pathex 指向 src, 不需要把项目装进 .venv
        # (见 pyproject 的 [tool.uv]; 与 ci.yml 的其它作业一致)。
        run: uv sync --locked --no-default-groups --group test --group quality --group package --no-install-project

      - name: Run build checks
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
          uv run pytest --cov

      - name: Check the application icon is up to date
        # 硬门禁: 入库的位图必须出自当前这份 resources/app.svg("改了 SVG 忘了重画"就在这里判红)。
        # 这一步**不需要 ffmpeg**(只比指纹), 所以发布不依赖 runner 上有渲染工具。
        # 顺序不许反: 下面那条探针会重写指纹, 先探针再 --check 就查不出"入库产物陈旧"了。
        run: uv run python scripts/build_icon.py --check

      - name: Probe the icon pipeline on this runner (informational)
        # 只回答一个问题: "这条流水线在这台 runner 上能不能自己从 SVG 画出位图, 画出来的
        # 字节与我们入库的是否一致"。画不出来(没装 ffmpeg / 那份 ffmpeg 没有 librsvg)只记
        # 一条警告并**照常发布** —— 入库的位图已由上一步证明与 SVG 一致。产物写进工作区外的
        # 临时目录, 仓库一个字节都不动(不想切发布就单独跑 `Icon probe` 工作流)。
        # `continue-on-error`: 万一 pwsh 把非零退出码当异常抛(与 runner 的 PS 设置有关),
        # 这一步也绝不该拦发布。
        continue-on-error: true
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            Write-Host "::warning::这台 runner 上没有 ffmpeg —— 跳过重画验证, 发布使用入库的位图"
            exit 0
          }
          Write-Host ((ffmpeg -hide_banner -version | Select-Object -First 3) -join "`n")
          $probe = Join-Path $env:TEMP "icon-probe"
          uv run python scripts/build_icon.py --force --out-dir $probe
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::这台 runner 画不出图标(退出码 $LASTEXITCODE) —— 发布仍用入库的位图"
            exit 0
          }
          $differ = @()
          foreach ($name in @("app-256.png", "app-64.png", "app.ico")) {
            $mine = Join-Path "src/archive_management/resources" $name
            $theirs = Join-Path $probe $name
            if ((-not (Test-Path $theirs)) -or
                ((Get-FileHash $mine -Algorithm SHA256).Hash -ne (Get-FileHash $theirs -Algorithm SHA256).Hash)) {
              $differ += $name
            }
          }
          if ($differ.Count -gt 0) {
            Write-Host "::warning::runner 重画的位图与入库产物逐字节不同(ffmpeg 版本差异或产物陈旧): $($differ -join ', ')"
          } else {
            Write-Host "runner 重画的位图与入库产物逐字节一致"
          }

      - name: Build onedir and onefile packages
        run: uv run pyinstaller --noconfirm --clean packaging/archive-management.spec

      - name: Prepare build files
        shell: pwsh
        env:
          BUILD_LABEL: ${{ steps.build.outputs.label }}
          BUILD_VERSION: ${{ steps.build.outputs.version }}
          BUILD_REF: ${{ steps.build.outputs.ref }}
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path dist/ArchiveManagement/* -DestinationPath "release/ArchiveManagement-$env:BUILD_LABEL-windows-x64.zip"
          Copy-Item "dist/ArchiveManagement-onefile.exe" "release/ArchiveManagement-$env:BUILD_LABEL-windows-x64.exe"
          $files = Get-ChildItem release -File
          $hashes = foreach ($file in $files) {
            $hash = Get-FileHash $file.FullName -Algorithm SHA256
            "$($hash.Hash.ToLowerInvariant())  $($file.Name)"
          }
          $hashes | Set-Content release/SHA256SUMS.txt -Encoding ascii
          @{
            application = "ArchiveManagement"
            version = $env:BUILD_VERSION
            ref = $env:BUILD_REF
            platform = "windows-x64"
            commit = "${{ github.sha }}"
            built_at = (Get-Date).ToUniversalTime().ToString("o")
          } | ConvertTo-Json | Set-Content release/build-metadata.json -Encoding utf8

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ArchiveManagement-${{ steps.build.outputs.label }}-windows-x64
          path: release/
