name: Build Windows Package

# 三个入口(口径见 docs/development.md 的「打包」「发布」两节):
#   ① `workflow_call` —— ci.yml 在"合入 main 的 PR 且 CI 全绿"时调用它做**打包门禁**: 只构建 + 上传 artifact;
#   ② `push` 到 main —— 合入之后构建并发布 Release; 版本没变就只构建、不重复发;
#   ③ `workflow_dispatch` —— 手动编任意分支/提交(dev 只有这一个入口)。
# **PR 那一档必须是"被 ci.yml 调用"**: 跨工作流触发(`workflow_run`)产生的检查挂不到那个 PR 上,
# 永远进不了分支保护的必需检查 —— 想让"CI 通过才允许合入"成立, 编译就得发生在 PR 那次运行里。
on:
  workflow_call:
    inputs:
      ref:
        description: "要构建的分支或提交, 留空 = 触发这次运行的那个提交"
        required: false
        default: ""
        type: string
      checks:
        description: "构建前的检查档位: full(ruff/格式/mypy/pytest --cov) | build-only(只构建, 给 CI 已经跑过全量的门禁档用)"
        required: false
        default: full
        type: string
      publish:
        description: "构建完是否发布 GitHub Release"
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    # 与 ci.yml 同一份"纯文档改动"忽略清单: 只改 md / docs / instructions 的合入既不跑 CI, 也不该出包。
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/instructions/**"
      - ".github/prompts/**"
  workflow_dispatch:
    inputs:
      ref:
        description: "要构建的分支或提交,例如 dev"
        required: false
        default: main
        type: string
      checks:
        description: "构建前的检查档位"
        required: false
        default: full
        type: choice
        options:
          - full
          - build-only
      publish:
        description: "构建完是否发布 GitHub Release"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# 与 ci.yml 同理: 关掉 `uv run` 的隐式 sync, 否则它会按 pyproject 的**默认组**把整套开发
# 依赖装回来(这个作业已经显式装了 test / quality / package 三组)。
env:
  UV_NO_SYNC: "1"

jobs:
  build:
    # 不写作业级 `if:`: 三个入口都要构建 —— "该不该构建"由触发层决定(ci.yml 只在合入 main 的 PR 上
    # 调用它, 纯文档合入在 push 的 `paths-ignore` 就被挡掉)。原来那条 `pull_request: closed` + 来源
    # 分支名(dev / bugfix/*)的判据有个盲区: 从别的分支(如 hotfix/x)合入 main 就不构建 —— 已换成 push。
    name: 构建 Windows 发布包
    runs-on: windows-latest
    outputs:
      version: ${{ steps.build.outputs.version }}
      label: ${{ steps.build.outputs.label }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # 被调用时 `github.sha` 是**调用方**的提交(PR 轮次里就是那个 PR 的合并预览提交) —— 正是要构建的
          # 东西; 手动/发布档没给 `ref` 时也同样落在触发这次运行的那个提交上。
          ref: ${{ inputs.ref || github.sha }}

      - name: Resolve build metadata
        id: build
        shell: pwsh
        env:
          INPUT_REF: ${{ inputs.ref }}
          # PR 轮次里 `github.ref_name` 是 `<PR 号>/merge`, 所以来源分支要单独排在它前面。
          HEAD_REF: ${{ github.head_ref }}
          DEFAULT_REF: ${{ github.ref_name }}
        run: |
          # 产物名里的 ref 依次取: 显式传入的 ref → PR 的来源分支 → 触发这次运行的分支。
          $ref = if ($env:INPUT_REF) {
            $env:INPUT_REF
          } elseif ($env:HEAD_REF) {
            $env:HEAD_REF
          } else {
            $env:DEFAULT_REF
          }
          $source = Get-Content src/archive_management/packaging.py -Raw
          $match = [regex]::Match($source, '__version__\s*=\s*"([^"]+)"')
          if (-not $match.Success) {
            throw "Could not find __version__ in packaging.py"
          }
          $version = $match.Groups[1].Value
          $safe_ref = $ref -replace '[^A-Za-z0-9._-]', '-'
          "ref=$ref" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "label=$safe_ref-build-${{ github.run_number }}" >> $env:GITHUB_OUTPUT

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        # 只装这个作业要用的组(见 pyproject 的 [dependency-groups]): 构建前的门禁要
        # 质量组(ruff/mypy)与测试组(pytest --cov), 打包要 package 组(pyinstaller)。
        # `--no-install-project`: 打包靠 spec 里的 pathex 指向 src, 不需要把项目装进 .venv
        # (见 pyproject 的 [tool.uv]; 与 ci.yml 的其它作业一致)。
        # 门禁档(`checks: build-only`)跑的是同一套组 —— 为了省一次 sync 而拆两套环境不划算, 而
        # 且下面那批守卫是**按命令**算该装哪几组的。
        run: uv sync --locked --no-default-groups --group test --group quality --group package --no-install-project

      - name: Run build checks
        # 门禁档传 `checks: build-only`: 同一轮 CI 已经跑过三平台的用例与静态检查, 再在 Windows
        # runner(2 倍计价)上跑一遍只是多花时间。发布/手动档默认 full, 留着这一轮自证。
        # 注意三种触发里只有 push 取不到 `inputs`(空串) —— 空串不等于 build-only, 所以照跑。
        if: ${{ inputs.checks != 'build-only' }}
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
          uv run pytest --cov

      - name: Check the application icon is up to date
        # 硬门禁: 入库的位图必须出自当前这份 resources/app.svg("改了 SVG 忘了重画"就在这里判红)。
        # 这一步**不需要 ffmpeg**(只比指纹), 所以发布不依赖 runner 上有渲染工具 —— 也从不在
        # CI 上重画: 图标只在本地更新(2026-10-15 拆掉了原来的信息探针与 `Icon probe` 工作流,
        # 见 docs/development.md)。
        run: uv run python scripts/build_icon.py --check

      - name: Build onedir and onefile packages
        run: uv run pyinstaller --noconfirm --clean packaging/archive-management.spec

      # ← 产物冒烟就落在这里(构建之后、打 release/ 之前): 「能编」与「产物能起」是两件事 ——
      #   产物跑不起来就不该上传一个"看起来能发"的包。内容是四条判据(无参数启动 / `--version` /
      #   `doctor` / `gui --smoke`) × onedir 与 onefile, 外加单实例闸门, 全部指向临时 `--root`;
      #   每条都要限时(窗口起不来时 `gui` 会一直等), 判据取"退出码 + 侧效应"(临时 root 下真的出现
      #   配置/数据/日志三处), 不读 stdout —— 窗口化产物没有控制台。

      - name: Prepare build files
        shell: pwsh
        env:
          BUILD_LABEL: ${{ steps.build.outputs.label }}
          BUILD_VERSION: ${{ steps.build.outputs.version }}
          BUILD_REF: ${{ steps.build.outputs.ref }}
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path dist/ArchiveManagement/* -DestinationPath "release/ArchiveManagement-$env:BUILD_LABEL-windows-x64.zip"
          Copy-Item "dist/ArchiveManagement-onefile.exe" "release/ArchiveManagement-$env:BUILD_LABEL-windows-x64.exe"
          $files = Get-ChildItem release -File
          $hashes = foreach ($file in $files) {
            $hash = Get-FileHash $file.FullName -Algorithm SHA256
            "$($hash.Hash.ToLowerInvariant())  $($file.Name)"
          }
          $hashes | Set-Content release/SHA256SUMS.txt -Encoding ascii
          @{
            application = "ArchiveManagement"
            version = $env:BUILD_VERSION
            ref = $env:BUILD_REF
            platform = "windows-x64"
            commit = "${{ github.sha }}"
            built_at = (Get-Date).ToUniversalTime().ToString("o")
          } | ConvertTo-Json | Set-Content release/build-metadata.json -Encoding utf8

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ArchiveManagement-${{ steps.build.outputs.label }}-windows-x64
          path: release/

  publish:
    # 发布只在"合入 main 之后"或"手动要求"时进行。被 ci.yml 调用时 `github.event_name`
    # 是 `pull_request`(或 `workflow_call`)而**不是** push, 所以门禁那一档天然走不到这里;
    # 调用方那句 `permissions: contents: read` 也天然封住写权限 —— 这正是把写权限放在作业级的原因。
    name: 发布 GitHub Release
    needs: [build]
    if: ${{ inputs.publish == true || github.event_name == 'push' }}
    # 只有这一处需要写权限(顶层仍是 `contents: read`)。
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build.outputs.version }}
      LABEL: ${{ needs.build.outputs.label }}
    steps:
      - name: Download the build artifacts
        uses: actions/download-artifact@v7
        with:
          name: ArchiveManagement-${{ needs.build.outputs.label }}-windows-x64
          path: release

      - name: Decide whether this version still needs a release
        # 版本号是**手动维护的单一真相**: 同一个版本合入两次是家常便饭(小修、文档、
        # 只改守卫), 所以"版本没变"是**正常出口而不是失败**。判据是那个 tag/release 已经存在,
        # 与"这一轮改了哪些文件"无关 —— 比路径过滤可靠(不必猜哪些文件算"该发版")。
        id: decision
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::版本 $VERSION 已经发过一次 Release(v$VERSION 已存在), 本轮只构建、不重复发布。"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Create the release
        if: ${{ steps.decision.outputs.publish == 'true' }}
        # 两个参数不能省: ① `--repo` —— 这个作业没有 checkout, gh 无法从仓库推断出该操作哪一个;
        # ② `--target` —— 不给它时 gh 会把新 tag 指向**默认分支的当前 HEAD**, 而我们发的必须是
        # 触发这次运行的那个提交(清一色 `v<版本号>`, 版本号来自 `packaging.py`)。
        # 正文写死版本/提交/构建号, 不接 `--generate-notes`: 这一档要的是可复现的固定内容。
        run: |
          cat > release-notes.md <<EOF
          Windows x64 打包产物: onedir 压缩包 + onefile 可执行文件 + SHA256SUMS.txt + build-metadata.json。

          - 版本: $VERSION(来自 src/archive_management/packaging.py)
          - 提交: $GITHUB_SHA
          - 构建: $LABEL
          EOF
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ArchiveManagement v$VERSION" \
            --notes-file release-notes.md \
            release/*
