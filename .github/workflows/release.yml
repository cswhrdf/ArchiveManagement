name: Release Windows Package

# 两个入口(口径见 docs/development.md 的「打包」「发布」两节):
#   ① `push` 到 main —— 合入之后构建并发布 Release。**版本号由人在 PR 里改**(2026-11-01 起:
#      main 开了分支保护, 谁都推不进去 —— 包括 bot, 所以定版前移到 PR 阶段, 由 ci.yml 的
#      `release-hint` 作业提醒), `classify` 只读地复查"这次合入到底有没有动版本号";
#   ② `workflow_dispatch` —— 手动编任意分支/提交(dev 只有这一个入口), 不动版本号。
# 构建本身在 .github/workflows/release-build.yml 里(只读, 一个作业): 这里只转调它, 再加一个
# 专门管发布的作业 —— 于是"构建步骤只有一处定义"与"写权限只出现在这一份"同时成立。
# **PR 打包门禁不在这里**(2026-10-17 起): 门禁是 ci.yml 的 `windows-package` 作业**直接**调
# release-build.yml。两条理由: ① 跨工作流触发(`workflow_run`)产生的检查挂不到那个 PR 上, 永远
# 进不了分支保护的必需检查, 所以编译必须发生在 PR 那次运行里; ② 一旦 PR 那次运行调到这份工作流,
# 下面 `publish` 作业要的 `contents: write` 会让整份工作流判 "not valid"(嵌套权限是**逐作业静态
# 校验**的, 运行期的 `if` 拦不住), 报错原文见 release-build.yml 的开头。
on:
  push:
    branches: [main]
    # 与 ci.yml 同一份"纯文档改动"忽略清单: 只改 md / docs / instructions 的合入既不跑 CI, 也不该出包。
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/instructions/**"
      - ".github/prompts/**"
  workflow_dispatch:
    inputs:
      ref:
        description: "要构建的分支或提交,例如 dev"
        required: false
        default: main
        type: string
      checks:
        description: "构建前的检查档位"
        required: false
        default: full
        type: choice
        options:
          - full
          - build-only
      publish:
        description: "构建完是否发布 GitHub Release(勾上后先检查这个版本有没有发过)"
        required: false
        default: false
        type: boolean

# 两次合入紧挨着时, 后一次必须排队等前一次把新 tag 写完再判版 —— 否则两次会撞上同一个
# 版本号(第二次就只剩 publish 的"已发过"分支, 白构建一轮)。串行而不是取消: 排队的那轮
# 也要发它自己的版本。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# 这个工作流自己没有 uv 命令(构建在被调用的那一份里), 留着这一行只为与 release-build.yml 口径一致
# —— 守卫要求每个工作流顶层都关掉 `uv run` 的隐式 sync。
env:
  UV_NO_SYNC: "1"

jobs:
  classify:
    # 合入 main 之后**只读地复查**版本号(判定逻辑全在 scripts/release_bump.py, 取舍见
    # docs/development.md「发布」节): 版本号由人在 PR 里改 —— 2026-11-01 起 main 有分支保护,
    # 合入之后谁也推不进去, "自动加一位"那条路已经不存在了(实测 protected branch)。
    # 要发 0.1.0 / 1.0.0 这类"动前两位"的版本, 同样是在 PR 里手改 packaging.py: 那份 diff
    # 经过评审, 定版作业看到"版本号已经变了"就按人写的发, 不需要任何兜底动作。
    name: 检查版本号
    runs-on: ubuntu-latest
    outputs:
      # 构建与 tag 都要指这个提交。2026-11-01 起**没有 bump 提交**了(定版前移到 PR),
      # 所以它就是触发这次运行的那个提交 —— 留成 output 是为了让 build 与 publish 共用一处。
      ref: ${{ steps.ref.outputs.ref }}
      # first-release | manual | needs-bump: push 档拿它决定要不要说"版本号没动"。
      reason: ${{ steps.check.outputs.reason }}
    # **只读**: 定版不再改 main —— 分支保护禁止一切直接推送(bot 也不例外), 于是它前移到 PR 阶段
    # (由人在 PR 里改 packaging.py, ci.yml 的 release-hint 作业负责提醒)。这里只读版本号与 tag。
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # 要全部历史与 tag 才找得到"最近发过的版本", 手动重发那道前置检查也要 tag 表。
          fetch-depth: 0

      - name: Decide which version this commit would release
        # 只有 push 档判: 手动档编的是任意 ref, 版本号与它无关。
        # 脚本只用标准库(release_bump.py), runner 自带的 python3 就够, 不装 uv 环境;
        # 它**不写文件** —— 定版前移到 PR 了, 这里只是复查"这次合入到底有没有动版本号"。
        if: ${{ github.event_name == 'push' }}
        id: check
        run: |
          tags=$(git tag -l)
          # tag 名不含空白, 故意不加引号按词拆开(tag 表为空时 --tags 落成空列表 = 首版直发)。
          python3 scripts/release_bump.py \
            --file src/archive_management/packaging.py \
            --tags $tags >> "$GITHUB_OUTPUT"

      - name: Refuse to republish a version that is already released
        # 手动重发(workflow_dispatch + publish)的**前置检查**(2026-11-01 加): 这一档存在的理由
        # 就是"某次发包出了问题, 手动把那个 Release 删掉之后按原有流程发不出去"。所以先确认
        # 这个版本**不在 Releases 里** —— 在就直接拦住, 编译都不用开始; 删干净了才继续。
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # 版本号取 packaging.py 的**当前值**(输出里的 previous), 不是 release_bump 的"建议下一版号":
          # 重发的就是仓库里现在写的这个版本。
          reported=$(python3 scripts/release_bump.py \
            --file src/archive_management/packaging.py --tags $(git tag -l))
          version=$(printf '%s\n' "$reported" | sed -n 's/^previous=//p')
          if [ -z "$version" ]; then
            echo "::error::读不出 src/archive_management/packaging.py 的版本号。"
            exit 1
          fi
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::v$version 已经发过 Release。要重发请先在 Releases 页面删掉它, 或跑 gh release delete v$version --cleanup-tag, 再回来触发这一档。"
            exit 1
          fi
          # **tag 也不能复用**(2026-11-01 实测): Release 一旦发布过, 它那条 tag 就被 GitHub 锁成
          # "不可变 Release 用过的名字" —— 删掉 Release 之后重建同一版本会以
          #   422 pre_receive: tag_name was used by an immutable release
          #   Cannot create ref due to creations being restricted
          # 收场。所以这里必须先查 tag: 只要 tag 还在, 这个版本号就已经作废,
          # 正确做法是改 packaging.py 换一个版本号, 而不是删 Release 重发。
          if existing=$(git rev-parse --verify --quiet "v$version^{commit}"); then
            echo "::error::tag v$version 已经存在(指向 $existing), 这个版本号不能再用: 发布过的 Release 会把它的 tag 锁成不可变, 重建同版本会 422。要发新版本, 请把 packaging.py 的 __version__ 往上加一位。"
            exit 1
          fi
          echo "::notice::v$version 既没有 Release 也没有 tag, 继续按当前仓库的版本编译并发布。"

      - name: Record the ref to build and tag
        id: ref
        run: echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    # 只转调, 自己没有步骤: 命令、依赖分组与 `UV_NO_SYNC` 都在被调用的那份里(那种"纯调用作业"
    # 不装 Python 环境, 见 tests/unit/test_test_config.py 的 `_calls_another_workflow`)。
    # checks 原样透传: push 档取不到 `inputs`(空串) —— 空串不等于 build-only, 所以照跑 full。
    # ref 取 classify 传出的提交: 定版前移到 PR 之后它就是触发这次运行的提交, 但构建与 tag 仍
    # 共用同一处出口(手动档要能改)。
    name: 构建 Windows 发布包
    needs: [classify]
    uses: ./.github/workflows/release-build.yml
    with:
      ref: ${{ needs.classify.outputs.ref }}
      checks: ${{ inputs.checks }}

  publish:
    # 发布只在"合入 main 之后"或"手动要求"时进行。被 ci.yml 调用那一档根本不存在(它调的是
    # release-build.yml), 所以这里只判 push 与显式开关。
    name: 发布 GitHub Release
    needs: [classify, build]
    if: ${{ inputs.publish == true || github.event_name == 'push' }}
    # 只有 publish 与 classify 两个作业需要写权限(顶层仍是 `contents: read`); 构建那一份则完全
    # 只读 —— 一份工作流里的写权限必须由**调用它的人**先给得起, 这也是构建与发布拆成两份的原因。
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build.outputs.version }}
      RELEASE_TARGET: ${{ needs.classify.outputs.ref }}
    steps:
      - name: Check out repository
        # 只为了 scripts/release_notes.py: 不 checkout 的话 `gh release create` 也能跑, 但“从 PR
        # 里取变更说明”这一步要读仓库里的脚本。浅克隆就够(它不碰历史)。
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Download the build artifacts
        uses: actions/download-artifact@v7
        with:
          name: ArchiveManagement-${{ needs.build.outputs.label }}-windows-x64
          path: release

      - name: Say why this commit publishes nothing
        # 版本号没动 = 这次合入不发新版。这是**正常出口**, 不是失败: 定版在 PR 里做, 合入之后
        # 谁也改不了 main。把话说进构建日志, 免得有人以为发布链坏在定版那一步。
        if: ${{ github.event_name == 'push' && needs.classify.outputs.reason == 'needs-bump' }}
        run: |
          echo "::warning::这次合入没有改 src/archive_management/packaging.py 的版本号, 本轮只构建、不发 Release。下次合入前在 PR 里把 __version__ 往上加一位。"

      - name: Decide whether this version still needs a release
        # 定版前移到 PR 之后, "这个版本已经发过"有两种来路: 忘了改版本号(照旧号发), 或补跑同
        # 一个提交 —— 都是**正常出口而不是失败**(记一条 notice)。判据是那个 tag/release 已经存在,
        # 与"这一轮改了哪些文件"无关 —— 比路径过滤可靠(不必猜哪些文件算"该发版")。
        id: decision
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::版本 $VERSION 已经发过一次 Release(v$VERSION 已存在), 本轮只构建、不重复发布。"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # **tag 还在、Release 不在**: 这个版本号已经作废(2026-11-01 实测) —— 发布过的 Release
          # 会把它的 tag 锁成不可变, 重建同一版本会以
          #   422 pre_receive: tag_name was used by an immutable release
          # 收场。让它走到 create 只会把整轮弄红, 这里直接跳过并说清楚该做什么。
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::warning::tag v$VERSION 已存在但没有对应的 Release —— 这个版本号不能再用(发布过的 Release 会把 tag 锁成不可变), 本轮只构建。要发版请把 packaging.py 的 __version__ 往上加一位。"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Delete the previous pre-releases
        # 正式版一发布, dev 的快照就作废了: 仓库里同时挂着"最新正式版 + 更旧的 dev 快照",
        # 用户只会下错包。删 Release 连 tag 一起删(四段 tag 不是历史, 正式版只认三段)。
        if: ${{ steps.decision.outputs.publish == 'true' }}
        run: |
          set -eu
          tags=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json tagName,isPrerelease --jq '.[] | select(.isPrerelease) | .tagName')
          for tag in $tags; do
            echo "删除旧的预发布 $tag"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done

      - name: Compose the release notes from the pull request
        # 版本说明**由发起者在 PR 里手写**(模板的「本次变更」一节), CI 不再自动汇总(2026-10-31 定)。
        # 找 PR 用合入提交(`github.sha`), **不是** `RELEASE_TARGET`: 后者是 classify 传出的构建
        # 目标(手动档可以是任意 ref), 不一定关联着某个 PR —— 而 squash 合入只把**合并提交**
        # 挂在那个 PR 上。手动档没有 PR, 脚本会回退成一句说明。
        if: ${{ steps.decision.outputs.publish == 'true' }}
        run: |
          set -eu
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" > pulls.json
          python3 scripts/release_notes.py --pulls pulls.json --out release-notes.md

      - name: Create the release
        if: ${{ steps.decision.outputs.publish == 'true' }}
        # 两个参数不能省: ① `--repo` —— gh 无法从工作区推断出该操作哪一个仓库; ② `--target` ——
        # 不给它时 gh 会把新 tag 指向**默认分支的当前 HEAD**, 而我们发的必须是定版传来的那个提交
        # (tag 指的提交里 packaging.py 必须已经是这个版本号)。
        # 正文取上一步写好的 release-notes.md: 发布页只挂产物与用户写的说明, 不附校验和与构建
        # 元数据(2026-10-31 定)。
        # **同一个版本不能发第二次**(2026-11-01 实测): 发布过的 Release 会把它的 tag 锁成不可变,
        # 重建同版本会 422(tag_name was used by an immutable release)。上面 decision 已经把
        # "tag 还在"的情况挡掉了; 真要重发只能换版本号 —— 这是 GitHub 的规则, 不是流程选择。
        run: |
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_TARGET" \
            --title "ArchiveManagement v$VERSION" \
            --notes-file release-notes.md \
            release/*

  wiki:
    # 用户手册要标"本页内容随哪个版本更新", 而版本号只有发完版才知道 —— 所以它挂在发布之后, 只沿
    # main 发出来的那个 tag 同步(2026-10-31 定: 手册不再跟着 push 走, dev 上改的东西不发版就不上线)。
    # 为什么是"调"而不是"监听 release 事件": 这里的 `gh release create` 用的是 GITHUB_TOKEN, 它触发
    # 的 release 事件不会再生成工作流运行(GitHub 的防环规则), 监听那条路根本没人叫得动。
    name: 同步用户手册到 Wiki
    needs: [classify, build, publish]
    # publish 被跳过(手动档没开 publish 开关)时, 也就没有 tag 可同步。
    if: ${{ needs.publish.result == 'success' }}
    permissions:
      contents: write
    uses: ./.github/workflows/wiki.yml
    with:
      tag: v${{ needs.build.outputs.version }}
