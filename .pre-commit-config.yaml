# 提交前质量门禁
# 通过 uv 运行以保证与开发环境一致的依赖版本.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (autofix)
        entry: uv run ruff check --fix
        language: system
        types: [python]

      - id: black-check
        name: black check
        entry: uv run black --check
        language: system
        types: [python]

      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]

      - id: pytest
        name: pytest (blocker+critical)
        entry: uv run pytest --min-severity=critical
        language: system
        types: [python]
        pass_filenames: false
