# 提交前质量门禁
# 通过 uv 运行以保证与开发环境一致的依赖版本.
#
# 每条 `uv run` 都带 `--no-sync`(2026-10-08 的现场): 不带时, `pyproject.toml` / `uv.lock`
# 与 `.venv` 只要有漂移, **提交这条路**就会顺手重建虚拟环境 —— 实测编辑器的 Ruff 扩展
# 正占着 `.venv\Scripts\ruff.exe`, 复制失败(os error 32), 钩子 exit 2 拦下提交, 而环境
# 已被卸掉 14 个包、卡在"半装"状态(整套钩子只报了"ruff-check 失败")。关掉隐式 sync
# 之后: 提交永远不会动你的环境; 依赖真的变了它只会明确报"找不到工具", 那时**先跑一次
# `uv sync` 再提交**即可。
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (autofix)
        entry: uv run --no-sync ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        # 不再用 `--check`: 它只报"哪个文件会被改", 于是流程是"提交 -> 被拦 -> 手工
        # `uv run ruff format <文件>` -> `git add` -> 再提交", 每次都得跑两遍(用户
        # 2026-10-05 的要求: 自动整理并把整理好的文件加回暂存区)。改成"就地排版 + 自己重新
        # 暂存"(与下面 compact-json 同一条理由与做法): 排版结果立刻进索引, 工作区与索引
        # 一致 ⇒ pre-commit 不算它"弄脏文件", **本次提交直接带上排版好的内容**; 只有
        # 加不进索引时才退回"拦下提交"(见 scripts/ruff_format_and_stage.py)。
        name: ruff format (自动排版并重新暂存)
        entry: uv run --no-sync python scripts/ruff_format_and_stage.py
        language: system
        types: [python]

      - id: compact-json
        # 固定数据清单(平台工具排除清单等“只给程序读”的 JSON)必须保持单行紧凑格式;
        # 编辑器一格式化就会展开成多行, 手工转回去容易漏, 所以由钩子就地压回。
        # 脚本改写完会自己 `git add` 暂存: 工作区与索引一起变单行后就不算“弄脏文件”,
        # 本次提交直接带上转换好的内容, 不需要重新 add。
        name: compact JSON (清单转单行)
        entry: uv run --no-sync python scripts/compact_json.py
        language: system
        # 只管 resources 顶层的固定数据清单; resources/i18n/*.json 是给人看/审校的
        # 文案资源, 继续保持多行。
        files: ^src/archive_management/resources/[^/]+\.json$

      - id: build-icon
        # 图标的唯一真相是 resources/app.svg: 改了它就地把 app.ico / app-*.png 重画好,
        # 并像 compact-json / ruff-format 那样自己加回暂存区(本次提交直接带上新产物)。
        # 没改 SVG 时钩子根本不会被触发; 位图已是最新时脚本是空操作 —— 所以**没装 ffmpeg
        # 也能正常开发**, 只有真的要重画时才需要它(报错里会给出 --ffmpeg 与环境变量两条路)。
        name: 应用图标 (SVG 重画为 ico/png)
        entry: uv run --no-sync python scripts/build_icon.py --stage
        language: system
        pass_filenames: false
        files: ^src/archive_management/resources/app\.svg$

      - id: mypy
        name: mypy
        entry: uv run --no-sync mypy
        language: system
        types: [python]

      - id: deptry
        # 依赖卫生(未声明 / 多余 / 传递依赖): 全项目检查, 因此不跟着变动的文件逐个跑;
        # 依赖清单变了、或代码的导入变了都要重查一次。
        name: deptry (依赖检查)
        entry: uv run --no-sync deptry .
        language: system
        pass_filenames: false
        files: ^(src/|tests/|scripts/|pyproject\.toml$|uv\.lock$)

      - id: contrast-guard
        # 颜色对比度(WCAG): 跑那条既有守卫 —— 判据、登记表与阈值都在一处
        # (tests/unit/test_ui_contrast.py ↔ ui/contrast.py), 钩子不抄第二份会漂移的副本。
        # 判定只用我们自己的公式(ui/contrast.py): 它既算比值也定门槛, 失败信息能报出
        # 具体差多少(2026-10-16 起不再引第三方库做第二把算尺)。
        name: contrast-guard (WCAG 对比度)
        entry: uv run --no-sync pytest tests/unit/test_ui_contrast.py -q
        language: system
        pass_filenames: false
        files: ^(src/archive_management/ui/(palette|contrast)\.py|tests/unit/test_ui_contrast\.py)$

      - id: pytest
        # 只跑 blocker+critical(= 数据安全 + 核心逻辑): 等级按"失败影响面"划分,
        # 详见 docs/testing.md 的严重等级表。其余等级交给 CI 全量执行 —— 本地钩子要快,
        # 但"会丢数据"的回归不能漏。
        name: pytest (blocker+critical)
        entry: uv run --no-sync pytest --min-severity=critical
        language: system
        types: [python]
        pass_filenames: false
