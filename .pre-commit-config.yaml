# 提交前质量门禁
# 通过 uv 运行以保证与开发环境一致的依赖版本.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (autofix)
        entry: uv run ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format check
        entry: uv run ruff format --check
        language: system
        types: [python]

      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]

      - id: pytest
        # 只跑 blocker+critical(= 数据安全 + 核心逻辑): 等级按"失败影响面"划分,
        # 详见 docs/testing.md 的严重等级表。其余等级交给 CI 全量执行 —— 本地钩子要快,
        # 但"会丢数据"的回归不能漏。
        name: pytest (blocker+critical)
        entry: uv run pytest --min-severity=critical
        language: system
        types: [python]
        pass_filenames: false
